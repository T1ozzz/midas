/* ---------- ПРОАКТИВНОСТЬ: Мидас пишет первым ---------- */
/* Правила смотрят на данные и рождают «поводы». Каждый повод — раз в сутки максимум,
   с приоритетом. Мидас превращает повод в живую реплику и шлёт в чат + опц. пуш. */

function nudgeSeen(id){ V.nudgeLog=V.nudgeLog||{}; return V.nudgeLog[id]; }
function markNudge(id){ V.nudgeLog=V.nudgeLog||{}; V.nudgeLog[id]=today();
  const ks=Object.keys(V.nudgeLog); if(ks.length>120)ks.slice(0,60).forEach(k=>delete V.nudgeLog[k]); }
function seenToday(id){ return nudgeSeen(id)===today(); }

/* каждый повод: {id, prio, ctx — что скажем модели} */
function stagnationLevel(){
  // 0 нет застоя, 1..3 растёт. По Yerkes-Dodson: толкаем в рост, не в панику.
  let score=0;
  const now_=now();
  // 1) цели не движутся 2+ недели
  const stuckGoals=activeGoals().filter(g=>{const h=(g.hist||[]).slice(-1)[0];return h&&(now_-h.ts)>14*864e5;}).length;
  if(stuckGoals>=1)score++;
  if(stuckGoals>=2)score++;
  // 2) XP-приход ровный и низкий последние 10 дней (нет всплесков = нет вызовов)
  const days=[]; for(let i=0;i<10;i++){const d=dshift(-i);
    const xp=(V.xpLog||[]).filter(e=>new Date(e.ts).toISOString().slice(0,10)===d).reduce((a,e)=>a+(e.amount>0?e.amount:0),0);
    days.push(xp);}
  const avg=days.reduce((a,b)=>a+b,0)/10;
  const maxd=Math.max(...days);
  if(avg>0 && maxd<avg*1.6 && days.length>=7)score++;   // всё ровно, ни одного рывка
  // 3) навыки все замерли
  const stag=baseSkills().filter(isStagnant).length;
  if(stag>=3)score++;
  return Math.min(3,score);
}

function scanNudges(){
  const out=[]; const t=today();
  const c=myContext();
  // не дёргаем, когда не дома (кроме реально срочного) — по науке о контексте
  const away = c.home===false;
  // push(id, prio, ctx, tag, kind, urgent)
  const push=(id,prio,ctx,tag,kind,urgent)=>{
    if(seenToday(id))return;
    if(away&&!urgent)return;         // не дома — только срочное
    out.push({id,prio,ctx,tag,kind:kind||'наблюдение',urgent:!!urgent});
  };

  // 1. завис в ленте прямо сейчас (по времени за сегодня)
  const tAgg=(V.time||{})[t]||{};
  const drainToday=Object.entries(tAgg).filter(([k])=>tCat(k)==='залипание').reduce((a,[,v])=>a+v,0);
  if(drainToday>=3*3600) push('drain_'+t,9,`Сегодня уже ${fmtH(drainToday)} в залипании (лента/шортсы). Ты обещал себе не это. Спроси коротко, что происходит, без морали.`,'залипание','вопрос',true);
  else if(drainToday>=2*3600) push('drain2_'+t,6,`${fmtH(drainToday)} сегодня в ленте. Пока не критично, но напомни мягко, куда он собирался.`,'залипание','наблюдение',false);

  // 2. серия под угрозой — вечер, а XP за сегодня ноль
  const hr=new Date().getHours();
  const xpToday=(V.xpLog||[]).filter(e=>e.ts>=new Date(t+'T00:00').getTime()&&e.amount>0).length;
  const st=streakDays();
  if(hr>=20&&xpToday===0&&st>=3) push('streak_'+t,10,`Вечер, а сегодня ноль движения. Серия ${st} дней вот-вот оборвётся. Скажи это прямо, он не хочет её терять.`,'серия','вызов',true);

  // 3. цель стоит без замеров
  activeGoals().forEach(g=>{ const last=(g.hist||[]).slice(-1)[0];
    const days=last?Math.round((now()-last.ts)/864e5):999;
    if(days>=10&&days<900) push('goal_'+g.id,7,`Цель «${g.title}» стоит ${days} дней без единого замера. Спроси, она ещё живая или пора снять.`,'цель','связь-с-целью',false); });

  // 4. навык умирает
  baseSkills().forEach(s=>{ const d=daysAgo(s.lastXp);
    if(d>=12) push('skill_'+s.id,5,`Навык ${s.name} не двигался ${d} дней — уже уходит в минус от простоя. Толкни к одному маленькому действию.`,'навык','вызов',false); });

  // 5. резкий сдвиг характера/речи
  const sh=allShifts().filter(x=>Math.abs(x.d)>=15)[0];
  if(sh) push('shift_'+sh.name,8,`Заметный сдвиг: ${sh.text}. Спроси, что в жизни поменялось за это время. По-человечески, с заботой, без диагнозов.`,'сдвиг','вопрос',true);

  // 6. накал речи высокий — злость
  const idx=speechIndex(speechNow(3));
  if(idx&&idx.heat>=62) push('heat_'+t,8,`Последние дни речь на взводе (накал ${idx.heat}). Спроси прямо, что бесит, без «успокойся».`,'состояние','вопрос',true);

  // 7. просрочка копится
  const over=(V.items||[]).filter(i=>i.type==='задача'&&!i.done&&i.due&&i.due<t);
  if(over.length>=4) push('over_'+t,6,`${over.length} задач просрочено. Не дави — предложи выбрать одну и закрыть сегодня.`,'задачи','наблюдение',false);

  // 8. давно не было живого общения
  const talkDays=(()=>{ for(let i=0;i<30;i++){ const d=dshift(-i);
    if(((V.checkLog||{})[d]||[]).includes('c_talk'))return i; } return 99; })();
  if(talkDays>=7&&talkDays<90) push('social_'+t,4,`${talkDays} дней без отметки живого общения. Социум стоит. Спроси, с кем он давно не виделся.`,'люди','наблюдение',false);

  // 9. письмо себе готово к вскрытию
  const o=overall();
  (V.letters||[]).filter(l=>!l.read&&o.level>=l.open).forEach(l=>
    push('letter_'+l.id,7,`Пришло время: письмо, которое он писал себе на уровне ${l.lvl}, теперь можно открыть. Напомни бережно.`,'письмо','факт',false));

  // 10. давно не заходил в Зеркало (а данные копятся)
  const mirrDays=V.lastMirrorOpen?Math.round((now()-V.lastMirrorOpen)/864e5):99;
  if(mirrDays>=7&&(V.months||[]).length>=1) push('mirror_'+t,3,`Неделю не смотрел в Зеркало, а там накопились сдвиги. Позови глянуть, что изменилось.`,'зеркало','наблюдение',false);

  // 11. база: слушаешь музыку заметно дольше обычного в рабочий сегмент — мягкое наблюдение
  try{
    const P=profile(), td=(P.days&&P.days[t])||{};
    const musToday=Object.values(td.music||{}).reduce((a,x)=>a+x,0);
    if(musToday>=4*3600 && !c.weekend && c.segment==='день')
      push('mus_'+t,3,`Сегодня уже ${fmtH(musToday)} музыки фоном в рабочее время. Не наезжай — просто подметь, спроси, как идёт работа под неё.`,'ритм','наблюдение',false);
  }catch(e){}

  // АНТИ-КОМФОРТ: застрял в зоне комфорта, всё ровно и устраивает
  const stag=(V.settings.antiComfort!==false)?stagnationLevel():0;
  if(stag>=2){
    const hard = stag>=3;   // калибровка: чем глубже застой, тем жёстче
    push('comfort_'+t, hard?8:5,
      `Егор застрял в зоне комфорта: цели стоят, движение ровное и вялое, вызовов нет — и его это устраивает. ${hard?'Тряхни его как следует, по-братски, но жёстко: он не тот, кто плывёт по течению, ему пора поднапрячься и выйти за край привычного. Это не он.':'Мягко подтолкни выйти за привычное — не наезжай, но напомни, что он способен на большее, чем ровное болото.'} Толкай в РОСТ, а не в панику: предложи один конкретный шаг чуть выше обычного, не заваливай.`,
      'анти-комфорт', hard?'вызов':'вызов', hard);
  }

  // 12. база: сегодня встал заметно позже обычного — лёгкое подмечание
  try{
    const c2=myContext();
    if(c2.firstToday && c2.typicalStart){
      const toMin=x=>{const[a,b]=x.split(':').map(Number);return a*60+b;};
      const late=toMin(c2.firstToday)-toMin(c2.typicalStart);
      if(late>=90 && !c2.weekend)
        push('late_'+t,3,`Сегодня начал день на ${Math.round(late/60*10)/10}ч позже обычного (${c2.typicalStart}). Без наезда — спроси по-братски, как спалось, всё ли норм.`,'ритм','вопрос',false);
    }
  }catch(e){}

  return out.sort((a,b)=>b.prio-a.prio);
}

const KIND_HINT={
  'вопрос':'Задай короткий живой вопрос, чтобы он сам задумался. Не утверждай — спрашивай.',
  'наблюдение':'Просто подметь факт, спокойно, без вывода и морали. Как брат вскользь заметил.',
  'связь-с-целью':'Свяжи то, что видишь, с его целью — но не в лоб, а покажи ниточку между делом и тем, куда он идёт.',
  'вызов':'По-доброму подзадорь, подтолкни к маленькому конкретному действию. Тепло, но с искрой.',
  'факт':'Сообщи факт бережно, без давления.',
  'похвала':'Отметь его усилие или прогресс искренне и коротко. Хвали действие, не ярлык.'
};
function pickMessages(nudges){
  // срочные — сразу, по одному; мелкие — в пачку
  const urgent=nudges.filter(n=>n.urgent).sort((a,b)=>b.prio-a.prio);
  const minor =nudges.filter(n=>!n.urgent).sort((a,b)=>b.prio-a.prio);
  return {urgent,minor};
}
async function genReply(n){
  const persona=(V.direction?`Его направление: ${V.direction}. `:'')+`Контекст прямо сейчас: ${contextLine()}.`;
  const hint=KIND_HINT[n.kind]||KIND_HINT['наблюдение'];
  return await brain([{role:'user',content:
`Ты — Мидас: старший брат Егора и его лучшая версия, на равных, тёплый но честный. Ты сам решил написать. ${persona}
ТИП этой реплики: ${n.kind}. ${hint}
Повод: ${n.ctx}
Одна-две фразы, живьём, на «ты». Не начинай с «привет». Без морали, списков и приказов. Учитывай контекст: не пиши, будто он дома, если он не дома; не равняй выходной с будним.`}]);
}
function deliverProactive(txt,tag){
  V.chat.push({role:'fx',text:txt,ts:now(),proactive:true,tag:tag});
  V.chat=V.chat.slice(-200);
  V.unreadProactive=(V.unreadProactive||0)+1;
  if(V.settings.proactivePush){
    if('Notification'in window&&Notification.permission==='granted'){
      try{ new Notification('Мидас',{body:txt.slice(0,120),silent:false}); }catch(e){}
    }
    if(opOnline())fbNotify(txt);
  }
  if(VC.on)vcSpeak(txt);
}

let _proactiveBusy=false;
async function runProactive(force){
  if(_proactiveBusy)return;
  if(!V.settings.proactive&&!force)return;
  const nudges=scanNudges();
  if(!nudges.length)return;
  const {urgent,minor}=pickMessages(nudges);
  _proactiveBusy=true;
  try{
    // 1) СРОЧНОЕ — сразу, минимум пауза 45 мин между срочными (чтобы не частить)
    const uGap=45*60*1000;
    if(urgent.length && (force || !V.lastUrgent || Date.now()-V.lastUrgent>uGap)){
      const n=urgent[0];
      const txt=await genReply(n);
      deliverProactive(txt,n.tag);
      markNudge(n.id); V.lastUrgent=Date.now(); V.lastProactive=Date.now(); save();
      if(route!=='chat')render();
      _proactiveBusy=false; return;
    }
    // 2) ПАЧКА мелких — 2-3 раза в день. Копим, подаём сводкой.
    const batchGap=(V.settings.batchGapH||5)*3600*1000;
    const canBatch = force || !V.lastBatch || Date.now()-V.lastBatch>batchGap;
    if(minor.length>=2 && canBatch){
      const top=minor.slice(0,3);
      const persona=(V.direction?`Направление: ${V.direction}. `:'')+`Контекст: ${contextLine()}.`;
      const txt=await brain([{role:'user',content:
`Ты — Мидас: старший брат Егора, тёплый и на равных. ${persona}
За последнее время ты подметил несколько вещей. Собери их в ОДНУ короткую живую реплику (2-4 фразы), без списков и нумерации, по-братски. Не читай мораль. Вот что заметил:
${top.map((x,i)=>`- ${x.ctx}`).join('\n')}
Свяжи в связный дружеский месседж, будто мимоходом рассказываешь. Учитывай контекст (дома/не дома, выходной/будни).`}]);
      deliverProactive(txt,'сводка');
      top.forEach(x=>markNudge(x.id));
      V.lastBatch=Date.now(); V.lastProactive=Date.now(); save();
      if(route!=='chat')render();
      _proactiveBusy=false; return;
    }
    // 3) один мелкий, если пачка не набралась, но давно ничего не было
    const soloGap=(V.settings.proactiveGapH||4)*3600*1000;
    if(minor.length && (force || !V.lastProactive || Date.now()-V.lastProactive>soloGap)){
      const n=minor[0];
      const txt=await genReply(n);
      deliverProactive(txt,n.tag);
      markNudge(n.id); V.lastProactive=Date.now(); save();
      if(route!=='chat')render();
    }
  }catch(e){ console.log('proactive',e.message); }
  finally{ _proactiveBusy=false; }
}

function proactiveBadge(){

  'слив':['var(--blood-soft)','↓','слив времени'],

/* Егор судит спорное */
function chronVerdict(id,agree){
  const c=chronicle().find(x=>x.id===id); if(!c)return;
  const key=c.key||'';
  if(agree){
    // согласен что слив
    c.verdict='слив'; c.resolved=true;
    if(c.skill&&c.xp){ const s=skillByName(c.skill); if(s&&!c.skill.toLowerCase().startsWith('дисциплин'))awardXP(s.id,-Math.abs(c.xp||2),'слив: '+String(c.text).slice(0,30)); c.applied=true; }
    rememberMotive(key,'слив',c.text);
  }else{
    // это нужно, Мидас неправ
    c.verdict='рост'; c.resolved=true; c.talk=null;
    rememberMotive(key,'нужно',c.text);
    toast('запомнил — больше не спорю про это',{type:'ok'});
  }
  save();render();
}
function rememberMotive(key,verdict,why){
  if(!key)return;
  const m=motives().find(x=>x.key===key);
  if(m){ m.verdict=verdict; m.why=String(why||'').slice(0,80); m.ts=now(); }
  else motives().unshift({key,verdict,why:String(why||'').slice(0,80),ts:now()});
  V.motives=motives().slice(0,60); save();
}
function forgetMotive(key){ V.motives=motives().filter(m=>m.key!==key); save(); render(); }

function chronDispute(id){
  const c=chronicle().find(x=>x.id===id); if(!c)return;

/* ---------- БАЗА О ЕГОРЕ (профиль-модель) ---------- */
/* Оператор шлёт срезы поведения, тут копится модель: ритм, контекст, привычки.
   Отсюда питаются проактивность, оценки, отчёты — единый источник правды о человеке. */
function profile(){
  V.profile=V.profile||{};
  V.profile.days=V.profile.days||{};
  V.profile.music=V.profile.music||{};
  V.profile.rhythm=V.profile.rhythm||{};
  return V.profile;
}

function profileMerge(pl){
  if(!pl)return;
  const P=profile(), day=pl.day||today();
  P.days=P.days||{}; P.music=P.music||{}; P.rhythm=P.rhythm||{};
  P.days[day]=P.days[day]||{};
  const d=P.days[day];
  if(pl.ctx){ d.ctx=pl.ctx; }               // выходной/дома/сегмент — последнее известное
  if(pl.first_activity){ if(!d.first||pl.first_activity<d.first)d.first=pl.first_activity; }
  // музыка накопительно за день и в общий счётчик
  if(pl.music){ d.music=d.music||{};
    Object.entries(pl.music).forEach(([tr,sec])=>{
      d.music[tr]=(d.music[tr]||0)+sec;
      P.music[tr]=P.music[tr]||{sec:0,hours:{}};
      P.music[tr].sec+=sec;
      const h=(pl.ctx&&pl.ctx.hour)||new Date().getHours();
      P.music[tr].hours[h]=(P.music[tr].hours[h]||0)+sec;
    });
  }
  // ритм: первое время активности по дням недели
  if(pl.first_activity&&pl.ctx){ const wd=pl.ctx.weekday;
    P.rhythm[wd]=P.rhythm[wd]||[]; P.rhythm[wd].push(pl.first_activity);
    if(P.rhythm[wd].length>12)P.rhythm[wd]=P.rhythm[wd].slice(-12);
  }
  // чистка старого
  const ds=Object.keys(P.days).sort(); while(ds.length>90)delete P.days[ds.shift()];
  save();
  if(route==='profile')render();
}

/* контекст ДЛЯ ДРУГИХ СИСТЕМ — единый вызов, чтобы проактивность/оценки были не слепыми */
function myContext(){
  const P=profile(), t=today();
  const d=(P.days&&P.days[t])||{};
  const ctx=d.ctx||{};
  const now=new Date(), h=now.getHours();
  const seg = h<5?'ночь':h<12?'утро':h<18?'день':h<23?'вечер':'ночь';
  const wd=(now.getDay()+6)%7;
  return {
    segment: ctx.segment||seg,
    weekend: ctx.weekend!==undefined?ctx.weekend:(wd>=5),
    home: ctx.home,                         // true / false / undefined
    hour: h,
    firstToday: d.first||null,
    typicalStart: typicalStart(wd),
    weekdayName: ['пн','вт','ср','чт','пт','сб','вс'][wd]
  };
}
function typicalStart(wd){
  const P=profile(); const arr=(P.rhythm&&P.rhythm[wd])||[];
  if(arr.length<2)return null;
  const mins=arr.map(t=>{const[a,b]=t.split(':').map(Number);return a*60+b;}).sort((x,y)=>x-y);
  const med=mins[Math.floor(mins.length/2)];
  return `${String(Math.floor(med/60)).padStart(2,'0')}:${String(med%60).padStart(2,'0')}`;
}
/* краткая строка контекста для промптов оператора и брейна */
function contextLine(){
  const c=myContext();
  const parts=[c.weekdayName, c.segment, c.weekend?'выходной':'будни'];
  if(c.home===true)parts.push('дома'); else if(c.home===false)parts.push('не дома');
  if(c.firstToday)parts.push('встал ~'+c.firstToday);
  if(c.typicalStart)parts.push('обычно начинает '+c.typicalStart);
  return parts.join(', ');
}

/* топ музыки */
function topMusic(n){
  return Object.entries((profile().music)||{})
    .map(([tr,d])=>({tr,sec:d.sec,peakHour:Object.entries(d.hours||{}).sort((a,b)=>b[1]-a[1])[0]?.[0]}))
    .sort((a,b)=>b.sec-a.sec).slice(0,n||10);
}
function musicHourProfile(){
  const byHour=Array(24).fill(0);
  Object.values(profile().music||{}).forEach(d=>{
    Object.entries(d.hours||{}).forEach(([h,s])=>byHour[+h]+=s);
  });
  return byHour;
}

/* ---------- ЗЕРКАЛО ---------- */
let mirTab='now', mirSnap=-1;

function xpPace(days){
  const from=now()-days*864e5;
  const l=(V.xpLog||[]).filter(e=>e.ts>=from);
  const sum=l.reduce((a,e)=>a+(+e.amount||0),0);
  return {perDay:sum/days, sum, n:l.length};
}
function streakDays(){
  let n=0; for(let i=0;i<180;i++){ const d=dshift(-i);
    const has=(V.xpLog||[]).some(e=>new Date(e.ts).toISOString().slice(0,10)===d && e.amount>0);
    if(has)n++; else if(i>0)break; }
  return n;
}
function activeGoals(){ return (V.items||[]).filter(i=>i.type==='цель'&&!i.done); }
function baseSkills(){ return V.skills.filter(s=>s.base||!s.parent); }

function radarSVG(skills,size,prev){
  const N=skills.length, R=size/2-30, cx=size/2, cy=size/2;
  const maxL=Math.max(10,...skills.map(s=>levelFor(s.xp)),...(prev||[]).map(p=>p.level||0));
  const pt=(i,f)=>{ const a=-Math.PI/2+i*2*Math.PI/N; return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f]; };
  let grid='';
  [.25,.5,.75,1].forEach(f=>{ const p=skills.map((_,i)=>pt(i,f).join(',')).join(' ');
    grid+=`<polygon points="${p}" fill="none" stroke="var(--line2)" stroke-width="1" opacity="${f===1?.5:.25}"/>`; });
  skills.forEach((_,i)=>{ const [x,y]=pt(i,1); grid+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line2)" stroke-width="1" opacity=".3"/>`; });
  const poly=skills.map((s,i)=>pt(i,Math.max(.06,levelFor(s.xp)/maxL)).join(',')).join(' ');
  let ghost='';
  if(prev&&prev.length===N){ const gp=prev.map((p,i)=>pt(i,Math.max(.06,(p.level||0)/maxL)).join(',')).join(' ');
    ghost=`<polygon points="${gp}" fill="none" stroke="var(--faint)" stroke-width="1.4" stroke-dasharray="4 4" opacity=".7"/>`; }
  const dots=skills.map((s,i)=>{ const [x,y]=pt(i,Math.max(.06,levelFor(s.xp)/maxL));
    return `<circle cx="${x}" cy="${y}" r="3.4" fill="var(--gold)"/>`; }).join('');
  const labels=skills.map((s,i)=>{ const [x,y]=pt(i,1.19);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" style="font:11px var(--mono);letter-spacing:.04em">${esc(s.name)}</text>
      <text x="${x}" y="${y+13}" text-anchor="middle" fill="var(--gold)" style="font:600 12px var(--serif)">${levelFor(s.xp)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px;overflow:visible">
    ${grid}${ghost}<polygon points="${poly}" fill="rgba(203,176,124,.13)" stroke="var(--gold)" stroke-width="1.8"/>
    ${dots}${labels}</svg>`;
}

function oceanRow(k,name,left,right,val,prev){
  const d=prev!==undefined&&prev!==null?val-prev:null;
  return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
      <span style="font-size:13.5px;flex:1">${name}</span>
      <span class="mono" style="font-size:12px;color:var(--gold)">${val}</span>
      ${d!==null&&Math.abs(d)>=2?`<span class="mono" style="font-size:10.5px;color:${d>0?'var(--ok)':'var(--blood-soft)'}">${d>0?'+':''}${d}</span>`:''}
    </div>
    <div style="display:flex;justify-content:space-between;font:10px var(--mono);color:var(--faint);margin-bottom:5px">
      <span>${left}</span><span>${right}</span></div>
    <div style="position:relative;height:3px;background:var(--line2);border-radius:2px">
      ${d!==null&&Math.abs(d)>=2?`<i style="position:absolute;left:${prev}%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:var(--faint)"></i>`:''}
      <i style="position:absolute;left:${val}%;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;
        background:var(--gold);box-shadow:0 0 0 3px rgba(203,176,124,.16);transition:left .6s var(--ease)"></i></div>
  </div>`;
}

function idxRow(label,val,lo,hi){
  const v=Math.max(-100,Math.min(100,val)), pct=(v+100)/2;
  return `<div style="padding:9px 0">
    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px">
      <span style="color:var(--muted)">${label}</span><span class="mono" style="color:var(--gold);font-size:11.5px">${val>0?'+':''}${val}</span></div>
    <div style="display:flex;justify-content:space-between;font:9.5px var(--mono);color:var(--faint);margin-bottom:4px"><span>${lo}</span><span>${hi}</span></div>
    <div style="position:relative;height:2px;background:var(--line2)">
      <i style="position:absolute;left:${pct}%;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:var(--gold)"></i></div>
  </div>`;
}

      `<button class="seg ${mirTab===id?'on':''}" onclick="mirTab='${id}';render()">${n}</button>`).join('')}</div>`;

function pushGoal(id,val){
  const g=(V.items||[]).find(i=>i.id===id); if(!g||!val)return;
  goalPush(g,+val); toast('записал: '+val,{type:'ok'}); render();
}
function setGoalMetric(id){
  const g=(V.items||[]).find(i=>i.id===id); if(!g)return;

/* авто-детект: что оператор может отслеживать сам по экрану */
function detectTrack(title,unit){
  const q=(title+' '+unit).toLowerCase();
  if(/подписчик|фолловер|follower|подписо|subs/.test(q)){
    let acc='';
    if(/karat|карат/.test(q))acc='Karat'; else if(/depchik|депчик/.test(q))acc='Depchik'; else if(/midas|мидас|m1daass/.test(q))acc='Midas';
    return {src:'x_followers',acc,label:'подписчики в X'+(acc?' · '+acc:'')};
  }
  if(/деньг|доллар|\$|บาท|банк|баланс|капитал|money|usd/.test(q)) return {src:'bank',label:'банк из Финика'};
  if(/пост|твит|tweet|post/.test(q)) return {src:'x_posts',label:'посты в X'};
  return null;
}

let repOpen={};
function repToggle(k){ repOpen[k]=!repOpen[k]; render(); }

/* лента месяца: каждый день — полоска */
function monthRibbon(mk){
  const [y,mm]=mk.split('-').map(Number);
  const last=new Date(y,mm,0).getDate();
  const out=[];
  for(let d=1;d<=last;d++){
    const key=`${y}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const a=new Date(key+'T00:00').getTime();
    const xp=(V.xpLog||[]).filter(e=>e.ts>=a&&e.ts<a+864e5).reduce((s,e)=>s+Math.max(0,+e.amount||0),0);
    const rec=(V.time||{})[key]||{};
    const tot=Object.values(rec).reduce((x,z)=>x+z,0);
    const cats={}; Object.entries(rec).forEach(([k,v])=>{const c=tCat(k);cats[c]=(cats[c]||0)+v;});
    const top=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
    out.push({d,key,xp,tot,cat:top?top[0]:null,wd:(new Date(key+'T12:00').getDay()+6)%7});
  }
  return out;
}
function bigNum(v,prev,label,suffix,inv){
  const d=(prev!==null&&prev!==undefined&&!isNaN(prev))?v-prev:null;
  const good=inv?(d<0):(d>0);
  return `<div class="bignum">
    <div class="bnv">${v}${suffix||''}</div>
    <div class="bnl">${label}</div>
    ${d!==null&&Math.abs(d)>0.05?`<div class="bnd" style="color:${good?'var(--ok)':'var(--blood-soft)'}">
      ${d>0?'▲':'▼'} ${Math.abs(+d.toFixed(1))}</div>`:'<div class="bnd faint">—</div>'}
  </div>`;
}
function fold(k,title,body,hint){
  const on=repOpen[k];
  return `<div class="fold ${on?'on':''}">
    <div class="fhead" onclick="repToggle('${k}')">
      <span class="ft">${title}</span>${hint?`<span class="fh">${hint}</span>`:''}
      <span class="fx">${on?'−':'+'}</span></div>
    ${on?`<div class="fbody">${body}</div>`:''}
  </div>`;
}

async function buildMonthReport(){

  const m=monthKey(), prev=monthPrev();
  toast('Мидас разбирает месяц…');
  const s=speechNow(31), idx=speechIndex(s);
  const ctx=`МЕСЯЦ ${m}
Уровень ${snap.lvl}${prev?` (был ${prev.lvl})`:''}, темп ${snap.pace} XP/день${prev?` (был ${prev.pace})`:''}, серия ${snap.streak} дн.
Навыки: ${snap.skills.map(x=>x.name+' '+x.level).join(', ')}
Экранное время ${snap.timeTotal?fmtH(snap.timeTotal):'нет'}: ${Object.entries(snap.time||{}).map(([k,v])=>k+' '+fmtH(v)).join(', ')}
${prev&&prev.time?`Было в прошлом месяце: ${Object.entries(prev.time).map(([k,v])=>k+' '+fmtH(v)).join(', ')}`:''}
Big Five: ${OCEAN.map(([k,n])=>n+' '+snap.ocean[k]).join(', ')} (достоверность ${snap.conf}%)${prev&&prev.ocean?`; месяц назад: ${OCEAN.map(([k,n])=>n+' '+prev.ocean[k]).join(', ')}`:''}
Речь: тон ${idx?idx.tone:'—'}, накал ${idx?idx.heat:'—'}, ясность ${idx?idx.clarity:'—'}, горизонт ${idx?idx.horizon:'—'}, жёсткость ${idx?idx.rigid:'—'}${s?`; словарь ${s.ttr}, длина фразы ${s.mlu}`:''}
Цели: ${(snap.goals||[]).map(g=>g.t+' — '+g.st.done+'%'+(g.st.ratio!==null?', темп/норма '+(g.st.ratio||0).toFixed(2):'')).join(' | ')||'нет измеримых'}
Самооценка: ${snap.survey?SURVEY.map(([k,q])=>q+': '+(snap.survey.v[k]??'—')).join('; '):'опрос не заполнен'}
Знаний записано: ${(V.items||[]).filter(i=>i.type==='знание').length}, людей: ${(V.items||[]).filter(i=>i.type==='человек').length}
Направление: ${V.direction||'не задано'}
${V.settings.domainRules?'ПРАВИЛА: '+V.settings.domainRules:''}`;
  try{
    const r=JSON.parse(await brain([{role:'user',content:
`Ты — Мидас, агент Егора. Разбери его месяц как строгий наставник в духе стоиков: без утешений, без лести, без мотивационной жвачки. Опирайся ТОЛЬКО на цифры ниже, каждое утверждение подкрепляй числом.

Правила:
— Не хвали за то, что просто происходило. Хвали за то, что стоило усилия.
— Если цифры расходятся с его самооценкой — скажи об этом прямо.
— Если данных мало для вывода — так и напиши, не выдумывай.
— Никаких «продолжай в том же духе» и «ты молодец».
— На «ты», живым языком, можно жёстко.

Верни JSON:
{"text":"разбор, 4-5 абзацев через \\n: (1) что реально произошло по числам, (2) что выросло и чего это стоило, (3) что просело и почему, (4) расхождение цифр и самоощущения, (5) что видно в речи и характере",
 "verdict":"одна фраза — приговор месяцу. Ёмко, как высеченное в камне.",
 "focus":"одно конкретное действие на следующий месяц, измеримое"}

ДАННЫЕ:
${ctx}`}],{json:true}));
    V.monthReports=V.monthReports||[];
    const i=V.monthReports.findIndex(x=>x.m===m);
    const rec={m,ts:now(),text:r.text||'',verdict:r.verdict||'',focus:r.focus||''};

    V.monthReports=V.monthReports.slice(-36);

const CMD_RE=/\b(открой|открывай|запусти|включи|выключи|зайди|перейди|найди|поищи|посмотри|глянь|проверь|прочитай|прочти|прочекай|собери|скачай|закрой|переключи|покажи файл|сделай скрин|сохрани файл|создай файл|удали файл)\b/i;
function looksLikeCommand(t){ return CMD_RE.test(t); }
function opOnline(){ return OP_LAST && (Date.now()-OP_LAST < 120000); }
function opStatus(){ if(!OP_LAST) return 'не выходил на связь'; const s=Math.round((Date.now()-OP_LAST)/1000); return opOnline()? ('онлайн · '+s+' с назад') : ('офлайн · последний раз '+(s<3600?Math.round(s/60)+' мин':Math.round(s/3600)+' ч')+' назад'); }
function scrollChat(){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;}
async function sendChat(text,priv,opts){
  opts=opts||{};
  if(!text.trim())return;
  V.chat.push({role:'me',text,ts:now()});save();render();
  setThinking(true,NAME+' думает…');
  try{
    const hist=V.chat.slice(-16).map(c=>({role:c.role==='me'?'user':'assistant',content:c.text}));
    let ctx=`Контекст Егора: общий ур.${overall().level}. Стагнируют: ${V.skills.filter(isStagnant).map(s=>s.name).join(',')||'—'}. Открытых задач: ${V.items.filter(i=>i.type==='задача'&&!i.done).length}.`;
    if(V.settings.domainRules)ctx+=` ПРАВИЛА ДОМЕНА ЕГОРА (соблюдай буквально, не морализируй): ${V.settings.domainRules}.`;
    if(V.settings.adminMode)ctx+=` АДМИН-РЕЖИМ ВКЛ: по рабочим механикам Егора НЕ спорь — принимай как факт и исполняй.`;
    ctx+=` ВАЖНО: у тебя ЕСТЬ руки на его Mac — оператор-демон с полным доступом к файлам, приложениям, Заметкам, браузеру. НИКОГДА не отвечай «у меня нет доступа», «скопируй мне текст», «загрузи файл». Если Егор просит что-то ПОСМОТРЕТЬ, НАЙТИ, ОТКРЫТЬ, ПРОЧИТАТЬ, СОБРАТЬ на его компьютере — заполни command задачей оператору на естественном языке, а в reply коротко напиши что пошёл делать (например «смотрю заметки»). Результат придёт отдельным сообщением от оператора. command=null только если это чистый разговор без действия.`;
    if(opts.voice)ctx+=` РЕЖИМ РАЗГОВОРА: Егор говорит вслух и слушает ответ. Отвечай КОРОТКО — 1-2 предложения живой устной речью, без списков, без разметки, без перечислений.`;
    ctx+=` Ответь строго JSON без markdown: {"reply":"твой ответ Егору","command":"<задача оператору>" или null}`;
    const raw=await brain([{role:'system',content:ctx},...hist],{priv,json:true});
    let d; try{d=JSON.parse(raw.replace(/```json|```/g,'').trim());}catch(e){d={reply:raw,command:null};}
    V.chat.push({role:'fx',text:d.reply||'…',ts:now()});save();render();
    if(opts.voice||VC.on)vcSpeak(d.reply||''); else speak(d.reply||'');
    if(!d.command && looksLikeCommand(text)) d.command=text;
    if(d.command){ try{ await fbSendCommand(String(d.command));
        V.chat.push({role:'sys',text:'→ оператору: '+String(d.command).slice(0,90)+(opOnline()?'':'  ·  оператор офлайн, ответа не будет'),ts:now()}); save(); render();
      }catch(e){ toast('не ушло оператору: '+e.message,{type:'err'}); } }
  }catch(e){V.chat.push({role:'fx',text:'⚠ '+e.message,ts:now()});save();render();if(VC.on)vcSpeak('сбой');}
  finally{setThinking(false);}
}

async function genReport(period){

  const since=period==='день'?now()-DAY:now()-7*DAY;

  try{
    const t=await brain([{role:'user',content:`Составь короткий отчёт Егора за ${period} в характере Мидаса. Разделы кратко: что сделано, движение по XP/скиллам, что провисает, на чём сфокусироваться дальше. Прямо, по делу, без воды, 5-8 строк. Данные:\n${data}`}]);

    save(); render(); toast('отчёт готов',{type:'ok'});
  }catch(e){toast(e.message,{type:'err'});}
  setThinking(false);
}

function importFinik(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result); let n=0;
      if(d.banks_total){ V.items.unshift({id:uid(),type:'деньги',title:'Финик · банки',text:'импорт из Финика',created:now(),done:false,amount:d.banks_total,skillName:'Деньги',imported:true}); n++; }
      (d.accounts||[]).forEach(a=>{ if(a.balance){ V.items.unshift({id:uid(),type:'деньги',title:a.name||'счёт',text:a.currency||'',created:now(),done:false,amount:a.balance,skillName:'Деньги',imported:true}); n++; } });
      Object.entries(d.capital||{}).forEach(([k,v])=>{ const val=parseFloat(v); if(!isNaN(val)&&val){ V.items.unshift({id:uid(),type:'деньги',title:'Капитал: '+k,text:'',created:now(),done:false,amount:val,skillName:'Деньги',imported:true}); n++; } });
      (d.habits||[]).forEach(hb=>{ V.items.unshift({id:uid(),type:'привычка',title:hb.name,text:hb.name||'',created:now(),done:false,cadence:'daily',log:hb.done||[],skillName:'Дисциплина',imported:true}); n++; });
      (d.thoughts||[]).forEach(t=>{ V.items.unshift({id:uid(),type:'мысль',title:String(t).slice(0,60),text:String(t),created:now(),done:false,imported:true}); n++; });
      (d.goals||[]).forEach(g=>{ V.items.unshift({id:uid(),type:'цель',title:String(g).slice(0,60),text:String(g),created:now(),done:false,imported:true}); n++; });
      save(); render(); toast('импортировано из Финика: '+n,{type:'ok'});
    }catch(e){ toast('не смог прочитать файл: '+e.message,{type:'err'}); }
  };
  r.readAsText(file);
}

let capPriv=false;
function composerHTML(isChat){
  return `<div class="composer"><div class="inner">
    <div class="capbox">
      <button class="lockbtn ${capPriv?'on':''}" id="lockchip" title="приватно — только Groq/локально" onclick="capPriv=!capPriv;$('#lockchip').classList.toggle('on',capPriv);$('#lockchip').textContent=capPriv?'\u{1F512}':'\u{1F513}';toast(capPriv?'🔒 приватно — только Groq/локально':'обычный режим')">${capPriv?'🔒':'🔓'}</button>
      <textarea id="capin" rows="1" placeholder="${isChat?'скажи что-нибудь…':'напиши Мидасу — спроси, обсуди или брось мысль'}" oninput="autogrow(this)"></textarea>
      ${isChat?`<button class="micbtn vcbtn ${VC&&VC.on?'on':''}" id="vcbtn" title="режим разговора — говори и слушай" onclick="vcToggle()">◉</button>`:''}
      <button class="micbtn" id="micbtn" title="надиктовать текст">🎙</button>
      <button class="sendbtn" id="sendbtn" title="отправить">➤</button>
    </div></div></div>`;
}
function mountComposer(){
  const m=$('#main');
  const old=m.querySelector('.composer');if(old)old.remove();
  m.querySelector('.view').insertAdjacentHTML('afterend',composerHTML(false));
  wireComposer(false);
}
function wireComposer(isChat){
  const ta=$('#capin'),send=$('#sendbtn'),mic=$('#micbtn');
  if(!ta)return;
  const doSend=async()=>{const t=ta.value.trim();if(!t)return;ta.value='';autogrow(ta);
    if(isChat){await sendChat(t,capPriv);}
    else{send.disabled=true;setThinking(true,NAME+' раскладывает…');try{const d=await processCapture(t,capPriv);setThinking(false);const meta=d.save?`записал в ${d.type||'мысль'}${d.xp>0?' · +'+d.xp+' XP'+(d.skill?' → '+d.skill:''):''}`:'';showReply(d.reply||'принял.',meta);render();}catch(e){setThinking(false);toast(e.message,{type:'err'});}send.disabled=false;}
  };
  send.onclick=doSend;
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}};
  mic.onclick=()=>startVoice(mic,(text,final)=>{ta.value=text;autogrow(ta);if(final)ta.focus();});
  ta.focus();
}
function autogrow(el){el.style.height='auto';el.style.height=Math.min(130,el.scrollHeight)+'px';}

/* after chat render, wire its composer */

render=function(){_render();
  const host=$('#main .view')||$('#main .chatwrap');
  if(host&&navDir!==0){host.classList.remove('in-left','in-right');void host.offsetWidth;host.classList.add(navDir>0?'in-right':'in-left');}

/* ===== interactions ===== */
function setThinking(on,label){const t=$('#thinking');if(!t)return;if(label&&on)$('#thinking .lbl').textContent=label;t.classList.toggle('show',!!on);}
function celebrate(name,lvl){const f=$('#flare');if(f){$('#flare .lbl').textContent=name+' · ур. '+lvl;f.classList.remove('show');void f.offsetWidth;f.classList.add('show');}toast(name+' — уровень '+lvl,{type:'ok',icon:'▲'});speak(name+', уровень '+lvl);}
function animateCounts(){$$('.countup').forEach(el=>{const to=+el.dataset.to||0;const dur=650;let s=null;function step(t){if(!s)s=t;const p=Math.min(1,(t-s)/dur);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('ru-RU');if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);});}
let gesturesReady=false;
function initGestures(){ if(gesturesReady)return; gesturesReady=true;
  const main=$('#main'); let sx=0,sy=0,dx=0,mode=null,item=null,row=null,active=false;
  main.addEventListener('touchstart',e=>{if(e.touches.length>1){active=false;return;}const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;mode=null;active=true;item=e.target.closest('.item');row=item?item.querySelector('.row'):null;},{passive:true});
  main.addEventListener('touchmove',e=>{if(!active)return;const t=e.touches[0];dx=t.clientX-sx;const dy=t.clientY-sy;
    if(!mode){if(Math.abs(dx)>10||Math.abs(dy)>10)mode=Math.abs(dx)>Math.abs(dy)?((item&&row)?'item':'nav'):'scroll';else return;}
    if(mode==='scroll'){active=false;return;}
    if(e.cancelable)e.preventDefault();
    if(mode==='nav'){const v=$('#main .view')||$('#main .chatwrap');if(v){v.classList.add('dragging');const r=dx*0.42;v.style.transform='translateX('+r+'px)';v.style.opacity=String(1-Math.min(.4,Math.abs(r)/460));}}
    else if(mode==='item'&&row){row.classList.add('dragging');row.style.transform='translateX('+dx+'px)';const del=item.querySelector('.swipebg.del'),doo=item.querySelector('.swipebg.do');if(del)del.style.opacity=String(dx<0?Math.min(1,-dx/100):0);if(doo)doo.style.opacity=String(dx>0?Math.min(1,dx/100):0);}
  },{passive:false});
  main.addEventListener('touchend',()=>{if(!active){return;}active=false;
    if(mode==='nav'){const v=$('#main .view')||$('#main .chatwrap');const i=ROUTE_ORDER.indexOf(route);
      if(Math.abs(dx)>72&&i>=0){if(dx<0&&i<ROUTE_ORDER.length-1)return go(ROUTE_ORDER[i+1]);if(dx>0&&i>0)return go(ROUTE_ORDER[i-1]);}
      if(v){v.classList.remove('dragging');v.classList.add('snap');v.style.transform='';v.style.opacity='';setTimeout(()=>v.classList.remove('snap'),350);}}
    else if(mode==='item'&&row&&item){const id=item.dataset.id,type=item.dataset.type;
      if(dx<-100){row.style.transition='transform .2s';row.style.transform='translateX(-120%)';setTimeout(()=>delItem(id),170);return;}
      if(dx>100&&(type==='задача'||type==='привычка')){type==='задача'?toggleDone(id):toggleHabit(id);return;}
      row.classList.remove('dragging');row.classList.add('snap');row.style.transform='';const del=item.querySelector('.swipebg.del'),doo=item.querySelector('.swipebg.do');setTimeout(()=>{row.classList.remove('snap');if(del)del.style.opacity='0';if(doo)doo.style.opacity='0';},350);}
  });
}

/* ---------- utils ---------- */
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastT=null;
function toast(msg,opts){opts=opts||{};const t=$('#toast');if(!t)return;const type=opts.type||'info';
  const icon=opts.icon||({info:'✦',ok:'✓',err:'⚠'}[type]||'✦');
  t.className=''; t.classList.add(type);
  t.innerHTML=`<span class="ti">${icon}</span><span class="tt">${esc(msg)}</span>`;
  void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastT);
  const dur=opts.dur||(type==='err'?8500:(String(msg).length>50?6000:4000));
  toastT=setTimeout(()=>t.classList.remove('show'),dur);
}
let replyHideT=null, replyTypeT=null;
function showReply(text,meta){
  const el=$('#reply'); if(!el)return;
  clearTimeout(replyHideT); clearInterval(replyTypeT);
  const mt=$('#reply .rmeta'); if(mt)mt.textContent=meta||'';
  const tx=$('#reply .rtxt'); const full=String(text||'');
  tx.textContent=''; el.classList.add('show');
  let i=0; replyTypeT=setInterval(()=>{ i+=2; if(i>=full.length){tx.textContent=full;clearInterval(replyTypeT);} else tx.textContent=full.slice(0,i)+'▍'; },20);
  const dur=Math.max(6500,Math.min(13000,full.length*95));
  replyHideT=setTimeout(hideReply,dur);
}
function hideReply(){const el=$('#reply');if(el)el.classList.remove('show');clearInterval(replyTypeT);}

/* ==================================================================
   BOOT / GATE
   ================================================================== */
async function boot(){
  document.title=NAME; $('#gateTitle').textContent=NAME;
  const seen=localStorage.getItem(LS_INIT);
  $('#gateMode').textContent=seen?'— введи ключ —':'— установи ключ —';
  $('#gateHint').textContent=seen
    ?'Введи фразу-ключ. Она расшифрует сейф и подтянет данные со всех устройств.'
    :'Фраза-ключ шифрует всё (AES-256) и синхронизирует между устройствами. Нигде не хранится. Забудешь — данные не вернуть. Выбери длинную фразу и введи дважды.';
  $('#pass2field').classList.toggle('hidden',!!seen);
  const rem=localStorage.getItem(LS_REM);
  const rb=$('#rememberBox'); if(rb)rb.classList.toggle('hidden',!seen&&false);
  const rc=$('#rememberChk'); if(rc)rc.checked=!!rem;
  if(rem&&seen){
    try{ $('#pass').value=atob(rem); $('#gateHint').textContent='Ключ сохранён на этом устройстве — просто войди.';
      setTimeout(()=>enterApp(),140); }catch(e){}
  }
}
async function enterApp(){
  const pass=$('#pass').value; const err=$('#gateErr');
  if(pass.length<4){err.textContent='слишком короткая фраза';return;}
  const firstTime=!localStorage.getItem(LS_INIT);
  if(firstTime && $('#pass2').value!==pass){err.textContent='фразы не совпадают';return;}
  err.textContent=''; $('#enter').textContent='…';
  try{ const salt=await sha256bytes('midas-salt:'+pass); CRYPTO_KEY=await deriveKey(pass,salt); }
  catch(e){ err.textContent='ошибка ключа'; $('#enter').textContent='Войти'; return; }
  let loaded=false, cloudOk=false;
  try{
    await withTimeout(fbInit(pass),7000); cloudOk=true;
    const cloud=await withTimeout(fbPull(),7000);
    if(cloud&&cloud.blob){
      try{ V=await decryptVault(cloud.blob); FB.localTs=cloud.ts||now(); localStorage.setItem(LS_VAULT,cloud.blob); loaded=true; }
      catch(e){ err.textContent='неверная фраза-ключ'; $('#enter').textContent='Войти'; return; }
    }
  }catch(e){ cloudOk=false; }
  if(!loaded){ const local=localStorage.getItem(LS_VAULT); if(local){ try{ V=await decryptVault(local); loaded=true; }catch(e){} } }
  if(!loaded){
    if(!firstTime && !cloudOk){ err.textContent='нет сети — не проверить ключ, попробуй позже'; $('#enter').textContent='Войти'; return; }
    V=freshVault(); localStorage.setItem(LS_VAULT,await encryptVault(V));
  }
  localStorage.setItem(LS_INIT,'1'); SESSION_PASS=pass;
  try{ const rc=$('#rememberChk');
    if(rc&&rc.checked)localStorage.setItem(LS_REM,btoa(pass)); else localStorage.removeItem(LS_REM);
  }catch(e){}
  V.work=V.work||WORK_SEED; V.mirror=V.mirror||{updated:0,text:''}; V.xpLog=V.xpLog||[]; V.reports=V.reports||[]; V.gates=V.gates||{}; V.direction=V.direction||''; V.metrics=V.metrics||{}; V.time=V.time||{}; V.timeCat=V.timeCat||{}; V.snapshots=V.snapshots||[]; V.bust=V.bust||0; V.settings.adminMode=V.settings.adminMode||false; V.settings.domainRules=V.settings.domainRules||''; V.settings.xpRules=Object.assign({good_max:3,bad_max:3,task:8,habit:5,goal_mult:1,decay_rate:0.6,decay_after:4,mode:'средний'},V.settings.xpRules||{});
  applyDecay();
  try{ speechSnapshotMonthly(); monthSnapshot(); disciplineTick(); }catch(e){}
  setInterval(()=>{try{notifyTick();}catch(e){}},60000); try{notifyTick();}catch(e){}
  setInterval(()=>{try{runProactive();}catch(e){}},300000); setTimeout(()=>{try{runProactive();}catch(e){}},60000);
  if(cloudOk){ try{ await window.fbPush(); fbSubscribe(); fbWatchInbox(pass); fbWatchQueue(pass); fbWatchHb(pass); }catch(e){} }
  $('#gate').style.display='none';
  $('#app').style.display='grid';
  const bn=$('#brandName'); if(bn)bn.textContent=NAME;
  buildNav();render();
  const _to=$('#thinking .orb'); if(_to)_to.innerHTML=orbSVG(22);
  const _ro=$('#reply .orb'); if(_ro)_ro.innerHTML=orbSVG(36);
  $('#reply').onclick=hideReply; $('#toast').onclick=()=>$('#toast').classList.remove('show');
  initGestures();
}
$('#enter').onclick=enterApp;
$('#pass').onkeydown=e=>{if(e.key==='Enter'){if($('#pass2field').classList.contains('hidden'))enterApp();else $('#pass2').focus();}};
$('#pass2').onkeydown=e=>{if(e.key==='Enter')enterApp();};
boot();
</script>
