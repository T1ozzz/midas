<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="фиксик">
<meta name="theme-color" content="#0B0C0A">
<title>фиксик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --bg2:#0E0E10; --panel:rgba(255,255,255,.028); --panel2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --gold:#D9BE86; --gold-soft:#CBB07C; --gold-dim:#8A7442;
  --blood:#7a3a37; --blood-soft:#C56A63;
  --ivory:#ECEAE4; --muted:#9C988E; --faint:#605C54;
  --ok:#7FA06E; --warn:#C79A55;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Instrument Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.22,.68,.16,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ivory);font-family:var(--sans);font-size:15px;line-height:1.5;
  overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 620px at 80% -8%,rgba(203,176,124,.05),transparent 62%),
             radial-gradient(760px 560px at -8% 108%,rgba(124,58,55,.035),transparent 58%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-16px,10px,0)}}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;color:var(--ivory);background:none;border:none;outline:none}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
::selection{background:rgba(203,176,124,.26)}

@keyframes riseIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.93)}50%{opacity:1;transform:scale(1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- GATE ---------- */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:var(--bg);flex-direction:column;padding:24px;animation:fadeIn .6s ease}
.sigil{width:70px;height:70px;position:relative;margin-bottom:26px}
.sigil svg{width:100%;height:100%;display:block;overflow:visible}
.sigil .ring{transform-origin:center;animation:breathe 5.5s ease-in-out infinite}
.sigil .spin{transform-origin:center;animation:spin 34s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#gate h1{font-family:var(--sans);font-weight:600;font-size:26px;letter-spacing:.34em;color:var(--ivory);
  text-transform:uppercase;padding-left:.34em}
#gate .sub{color:var(--faint);font-size:12px;margin-top:9px;font-family:var(--mono);letter-spacing:.06em}
.gate-form{margin-top:32px;width:100%;max-width:330px;display:flex;flex-direction:column;gap:11px;
  animation:riseIn .7s var(--ease) .15s both}
.field{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;
  display:flex;align-items:center;gap:11px;transition:border-color .25s,background .25s;backdrop-filter:blur(8px)}
.field:focus-within{border-color:var(--gold-dim);background:var(--panel2)}
.field input{flex:1;font-size:15px}
.field .ic{color:var(--gold-dim);font-size:13px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:13px;padding:14px;font-size:13.5px;
  letter-spacing:.02em;color:var(--gold-soft);transition:.2s var(--ease);font-weight:500;backdrop-filter:blur(8px)}
.btn:hover{border-color:var(--gold-dim);color:var(--gold);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.solid{background:linear-gradient(180deg,rgba(203,176,124,.16),rgba(203,176,124,.05));border-color:var(--gold-dim);color:var(--gold)}
.gate-hint{color:var(--faint);font-size:12px;margin-top:18px;text-align:center;max-width:320px;line-height:1.65;
  animation:fadeIn 1s ease .4s both}
.remrow{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12.5px;color:var(--muted);
  padding:4px 2px;user-select:none}
.remrow input{width:15px;height:15px;accent-color:var(--gold);cursor:pointer}
.remrow span{opacity:.85}
.archline{margin-bottom:16px;padding:10px 14px;border-left:2px solid var(--line2);
  font:11px var(--mono);color:var(--faint);line-height:1.5}
.gate-err{color:var(--blood-soft);font-size:12.5px;min-height:16px;text-align:center;font-family:var(--mono)}

/* ---------- SHELL ---------- */
#app{position:fixed;inset:0;z-index:1;display:none;grid-template-columns:212px 1fr;grid-template-rows:100%}
.rail{background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.brand .mk{width:24px;height:24px}
.brand .nm{font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:.16em;color:var(--ivory);text-transform:lowercase}
.nav{display:flex;flex-direction:column;gap:1px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);
  font-size:13.5px;transition:.18s var(--ease);position:relative}
.nav a .gl{width:15px;text-align:center;font-size:13px;opacity:.75;transition:.18s}
.nav a:hover{color:var(--ivory);background:var(--panel)}
.nav a:hover .gl{opacity:1}
.nav a.on{color:var(--gold-soft);background:var(--panel2)}
.navgrp{font:9px var(--mono);letter-spacing:.14em;color:var(--faint);opacity:.55;
  padding:14px 12px 6px;user-select:none}
.navgrp:first-child{padding-top:4px}
.goalbig{padding:15px 0;border-bottom:1px solid var(--line)}
.goalbig:last-child{border-bottom:none}
.gbhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:11px}
.gbtitle{font-size:15px;color:var(--ivory);line-height:1.35}
.gbsub{font:11px var(--mono);color:var(--faint);margin-top:4px}
.gbmood{font:11px var(--mono);flex:none;padding-top:2px}
.gbbar{position:relative;height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:9px}
.gbbar i{display:block;height:100%;border-radius:4px;transition:width .6s var(--ease)}
.gbpct{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:9px var(--mono);color:var(--ivory);mix-blend-mode:difference}
.gbfoot{display:flex;align-items:center;gap:14px;font:10.5px var(--mono);color:var(--muted);flex-wrap:wrap}
.gbadd{margin-left:auto;display:flex;align-items:center;gap:6px}
.goalrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.goalrow:last-child{border-bottom:none}
.goalrow.done span{opacity:.6}
.grm{color:var(--gold-dim);font-size:12px;flex:none}
.gbtrack{font:9.5px var(--mono);color:var(--gold-dim);margin-bottom:9px;letter-spacing:.03em}
.gbtrack.manual{color:var(--faint);opacity:.7}


.nav a.on .gl{opacity:1}
.nav a.on::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:2px;
  background:var(--gold);border-radius:2px;box-shadow:0 0 8px rgba(203,176,124,.5)}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.rail-foot{padding:8px;display:flex;align-items:center;justify-content:space-between}
.lvlchip{font-family:var(--mono);font-size:11px;color:var(--gold-dim);letter-spacing:.04em;transition:.15s}
.rail-foot button.lvlchip:hover{color:var(--gold-soft)}

.main{overflow:hidden;position:relative;display:flex;flex-direction:column}
.view{padding:34px 40px 160px;max-width:960px;width:100%;margin:0 auto;flex:1;overflow-y:auto;min-height:0;animation:fadeIn .35s ease}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;gap:16px;flex-wrap:wrap}
.vtitle{font-family:var(--sans);font-size:32px;font-weight:600;letter-spacing:-.02em;color:var(--ivory);line-height:1.05}
.veyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:9px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;
  backdrop-filter:blur(10px);transition:.22s var(--ease)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.grid>*{animation:riseIn .55s var(--ease) both}
.grid>*:nth-child(2){animation-delay:.06s}.grid>*:nth-child(3){animation-delay:.12s}
.grid>*:nth-child(4){animation-delay:.18s}.grid>*:nth-child(5){animation-delay:.24s}.grid>*:nth-child(6){animation-delay:.3s}
.muted{color:var(--muted)}.faint{color:var(--faint)}.gold{color:var(--gold-soft)}.mono{font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.03em;
  padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.divider{height:1px;background:var(--line);margin:22px 0}

.oracle{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line2);
  border-radius:20px;padding:26px 28px;display:flex;gap:20px;align-items:flex-start;position:relative;overflow:hidden;
  backdrop-filter:blur(12px);animation:riseIn .6s var(--ease) both}
.oracle::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:radial-gradient(400px 200px at 88% 0%,rgba(203,176,124,.08),transparent 70%)}
.oracle .orb{flex:none;width:44px;height:44px;margin-top:2px;animation:breathe 6s ease-in-out infinite}
.oracle .say{font-family:var(--sans);font-style:normal;font-size:20px;line-height:1.5;color:var(--gold-soft);font-weight:500;letter-spacing:-.01em}
.oracle .say b{font-style:normal;color:var(--ivory);font-weight:500}

.skill{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px 18px;
  transition:.22s var(--ease);backdrop-filter:blur(10px)}
.skill:hover{border-color:var(--line2);transform:translateY(-2px)}
.skill.stag{border-color:rgba(197,106,99,.32)}
.skill .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.skill .nm{font-size:15px;font-weight:500;letter-spacing:-.01em}
.skill .sub{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:3px}
.skill .lv{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:nowrap;letter-spacing:.02em}
.bar{height:5px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:4px;
  transition:width 1s var(--ease);box-shadow:0 0 10px rgba(203,176,124,.35)}
.skill.stag .bar i{background:linear-gradient(90deg,#5a2d2b,var(--blood-soft));box-shadow:none}
.skill .foot{display:flex;justify-content:space-between;margin-top:9px;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.02em}

.item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;
  display:flex;gap:13px;align-items:flex-start;margin-bottom:9px;transition:.2s var(--ease);
  backdrop-filter:blur(8px);animation:riseIn .45s var(--ease) both}
.item:hover{border-color:var(--line2);transform:translateX(2px)}
.item .bod{flex:1;min-width:0}
.item .txt{font-size:14.5px;line-height:1.45}
.item .meta{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.item .x{color:var(--faint);font-size:17px;line-height:1;padding:2px 5px;opacity:0;transition:.15s}
.item:hover .x{opacity:1}.item .x:hover{color:var(--blood-soft)}
.chkbox{flex:none;width:20px;height:20px;border:1.5px solid var(--line2);border-radius:7px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:.18s var(--ease);color:transparent;font-size:12px}
.chkbox:hover{border-color:var(--gold-dim)}
.chkbox.done{background:var(--gold-dim);border-color:var(--gold-dim);color:var(--bg)}
.item.done .txt{color:var(--faint);text-decoration:line-through}
.streakdots{display:flex;gap:3px}
.streakdots i{width:7px;height:7px;border-radius:2px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.streakdots i.hit{background:var(--gold-dim);border-color:var(--gold-dim)}
.streakdots i.grace{background:var(--warn);border-color:var(--warn)}

.empty{text-align:center;padding:56px 20px;color:var(--faint);animation:fadeIn .6s ease}
.empty .big{font-family:var(--sans);font-size:19px;font-weight:500;color:var(--muted);margin-bottom:8px}

.subtabs{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap}
.subtabs button{padding:8px 15px;border-radius:22px;font-size:12.5px;color:var(--muted);
  border:1px solid transparent;font-family:var(--mono);letter-spacing:.01em;transition:.18s var(--ease)}
.subtabs button:hover{color:var(--ivory)}
.subtabs button.on{background:var(--panel2);border-color:var(--line2);color:var(--gold-soft)}

.chatwrap{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.msgs{flex:1;overflow-y:auto;padding:28px 40px 120px;max-width:800px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px;scroll-padding-bottom:120px}
.msg{display:flex;gap:13px;max-width:86%;animation:riseIn .4s var(--ease) both}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{flex:none;width:29px;height:29px;margin-top:3px;opacity:.9}
.msg .bub{padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.52}
.msg.fx .bub{background:var(--panel);border:1px solid var(--line);border-top-left-radius:5px;backdrop-filter:blur(8px)}
.msg.me .bub{background:linear-gradient(180deg,rgba(203,176,124,.14),rgba(203,176,124,.05));
  border:1px solid var(--gold-dim);border-top-right-radius:5px;color:var(--ivory)}
.msg.fx .bub .lead{font-family:var(--serif);font-style:italic}

.composer{position:absolute;left:0;right:0;bottom:0;padding:14px 40px 22px;z-index:6;
  background:linear-gradient(180deg,transparent,var(--bg) 24%,var(--bg));pointer-events:none}
.composer .inner{max-width:800px;margin:0 auto;pointer-events:auto}
.capbox{background:var(--panel2);border:1px solid var(--line2);border-radius:18px;padding:8px;
  display:flex;align-items:flex-end;gap:10px;box-shadow:0 8px 40px rgba(0,0,0,.5);backdrop-filter:blur(14px);
  transition:border-color .25s,box-shadow .25s}
.capbox:focus-within{border-color:var(--gold-dim);box-shadow:0 8px 44px rgba(0,0,0,.55),0 0 0 3px rgba(203,176,124,.07)}
.capbox textarea{flex:1;resize:none;font-size:15px;line-height:1.45;max-height:130px;padding:8px 0;background:none}
.capbox textarea::placeholder{color:var(--faint)}
.micbtn,.sendbtn{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;transition:.18s var(--ease);font-size:17px}
.micbtn{color:var(--muted);border:1px solid var(--line2)}
.micbtn:hover{color:var(--gold-soft);border-color:var(--gold-dim);transform:translateY(-1px)}
.micbtn.rec{color:var(--blood-soft);border-color:var(--blood);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(197,106,99,.4)}50%{box-shadow:0 0 0 7px rgba(197,106,99,0)}}
.sendbtn{background:linear-gradient(180deg,rgba(203,176,124,.2),rgba(203,176,124,.06));border:1px solid var(--gold-dim);color:var(--gold-soft)}
.sendbtn:hover{color:var(--gold);transform:translateY(-1px)}
.sendbtn:disabled{opacity:.4;transform:none}
.captools{display:flex;gap:9px;margin:0 auto 10px;max-width:800px;align-items:center;pointer-events:auto}
.lockchip{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);
  padding:5px 11px;border-radius:20px;display:flex;align-items:center;gap:6px;transition:.18s var(--ease)}
.lockchip:hover{color:var(--muted)}
.lockchip.on{color:var(--blood-soft);border-color:var(--blood)}
.captip{font-family:var(--mono);font-size:11px;color:var(--faint)}
.pill.okpill{color:var(--ok);border-color:var(--ok)}
.segs{display:flex;gap:7px;margin-bottom:16px}
.seg{padding:7px 15px;border:1px solid var(--line2);border-radius:11px;background:none;color:var(--muted);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;cursor:pointer;transition:.2s var(--ease)}
.seg:hover{border-color:var(--gold-dim);color:var(--ivory)}
.seg.on{border-color:var(--gold-dim);color:var(--gold);background:rgba(203,176,124,.08)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.tgrid{grid-template-columns:1fr}}
.trow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.tbar{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:3px;transition:width .5s var(--ease)}
.tsel{background:none;border:1px solid var(--line2);border-radius:7px;color:var(--faint);
  font-family:var(--mono);font-size:10.5px;padding:2px 5px;cursor:pointer;flex:none}
.tsel:hover{border-color:var(--gold-dim);color:var(--muted)}
.mirhead{display:flex;align-items:center;gap:18px}
.mirorb{flex:none;opacity:.9;filter:drop-shadow(0 0 14px rgba(203,176,124,.2))}
@media(max-width:640px){.mirhead{gap:12px}.mirorb svg{width:46px;height:46px}}
.mirgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
@media(max-width:880px){.mirgrid{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.pcell{background:var(--panel);padding:15px 14px;display:flex;flex-direction:column;gap:3px}
.pv{font:600 25px var(--serif);color:var(--gold);line-height:1}
.pl{font:10.5px var(--mono);color:var(--faint);letter-spacing:.06em}
.grow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.grow:last-child{border-bottom:none}
.gm{color:var(--gold-dim);font-size:11px}
.chain{display:flex;gap:0;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.chain::-webkit-scrollbar{display:none}
.chainnode{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px;cursor:pointer;
  position:relative;padding:6px 4px;transition:.2s var(--ease)}
.chainnode::before{content:'';position:absolute;top:12px;left:0;right:50%;height:1px;background:var(--line2)}
.chainnode::after{content:'';position:absolute;top:12px;left:50%;right:0;height:1px;background:var(--line2)}
.chainnode:first-child::before,.chainnode:last-child::after{display:none}
.chainnode .dot{width:9px;height:9px;border-radius:50%;background:var(--line2);position:relative;z-index:1;transition:.25s var(--ease)}
.chainnode .lv{font:600 15px var(--serif);color:var(--faint);transition:.2s}
.chainnode .dt{font:9.5px var(--mono);color:var(--faint);opacity:.7}
.chainnode:hover .lv{color:var(--muted)}
.chainnode.on .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(203,176,124,.14)}
.chainnode.on .lv{color:var(--gold)}
.snapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.snapcell{background:var(--panel);padding:11px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.snapcell b{font:600 15px var(--serif);color:var(--ivory)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.fcell{background:var(--panel);padding:16px 12px;text-align:center}

.btn:active,.sendbtn:active,.micbtn:active,.addbtn:active,.subtabs button:active,.chkbox:active{transform:scale(.95)}

const DAY=86400000;

/* ---------- CRYPTO (Web Crypto, PBKDF2 + AES-GCM) ---------- */
let CRYPTO_KEY=null;
const enc=new TextEncoder(), dec=new TextDecoder();
async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function safeStringify(obj){
  const seen=new WeakSet();
  return JSON.stringify(obj,(k,v)=>{
    if(typeof v==='object'&&v!==null){
      if(seen.has(v))return undefined;           // циклическая ссылка — отбрасываем
      if(v instanceof Node||v instanceof Window)return undefined; // DOM в сейф не пишем
      seen.add(v);
    }
    return v;
  });
}
async function encryptVault(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=enc.encode(safeStringify(obj));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},CRYPTO_KEY,data);
  const buf=new Uint8Array(iv.length+ct.byteLength); buf.set(iv); buf.set(new Uint8Array(ct),iv.length);
  return btoa(String.fromCharCode(...buf));
}
async function decryptVault(b64){
  const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const iv=raw.slice(0,12), ct=raw.slice(12);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},CRYPTO_KEY,ct);
  return JSON.parse(dec.decode(pt));
}
const LS_VAULT='fx_vault', LS_SALT='fx_salt', LS_INIT='fx_init', LS_REM='fx_rem';
async function sha256hex(str){const b=await crypto.subtle.digest('SHA-256',enc.encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function sha256bytes(str){return new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(str)));}

/* ---------- WORK SEED (перенос наших знаний по X) ---------- */
const WORK_SEED={
  note:'Загружено из наших наработок. Фиксик знает это и опирается при черновиках.',

/* ---------- LEVELING (обосновано: SDT, Lally 66д, loss-aversion) ---------- */
// XP отмечает мастерство, не «платит» (избегаем overjustification).
const XP_MODES={'простой':{factor:12,mult:1},'средний':{factor:24,mult:1},'хард':{factor:144,mult:3}};
function xpMode(){return (V.settings&&V.settings.xpRules&&V.settings.xpRules.mode)||'средний';}
function xpFactor(){return (XP_MODES[xpMode()]||XP_MODES['средний']).factor;}
function xpMult(){return (XP_MODES[xpMode()]||XP_MODES['средний']).mult;}
function levelFor(xp){const f=xpFactor(); return Math.max(1,Math.floor(Math.pow(Math.max(0,xp)/f,1/1.6))+1);}
function xpAtLevel(l){const f=xpFactor(); return Math.round(f*Math.pow(Math.max(0,l-1),1.6));}
function isMilestone(l){return l>0 && l%10===0;}
function skillProgress(s){
  const l=levelFor(s.xp), cur=xpAtLevel(l), nxt=xpAtLevel(l+1);
  return {level:l,pct:Math.min(100,((s.xp-cur)/(nxt-cur))*100),cur:s.xp-cur,need:nxt-cur};
}
const GATE_K={'простой':5,'средний':3,'хард':1};
function gateK(){return GATE_K[xpMode()]||3;}
function gatePassed(g){return V.gates&&V.gates[g]&&V.gates[g].passed;}
function numbersPath(g){const k=gateK();return V.skills.filter(s=>s.base).every(s=>levelFor(s.xp)>=g-k);}
function gateOK(g){return gatePassed(g)||numbersPath(g);}
function overall(){const t=V.skills.reduce((a,s)=>a+s.xp,0);const raw=levelFor(t);let cap=raw;
  for(let g=10;g<=raw;g+=10){ if(!gateOK(g)){cap=g-1;break;} }
  return {xp:t,level:cap,raw};}
function rankOf(l){return Math.floor(l/10);}
function roman(n){const r=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];return r[n]||('R'+n);}
const RANK_COLORS=['#8A8172','#C9A96A','#B08D3E','#A34A44','#7C6BB0','#5E8A9C','#5E9C6E','#C56A63','#D9BE86','#E8E1D2','#E8E1D2'];
function rankColor(l){return RANK_COLORS[Math.min(rankOf(l),RANK_COLORS.length-1)];}
function activeGate(){const o=overall();const g=Math.floor(o.level/10)*10+10;return {g,atWall:o.level===g-1,o};}
function taskDone(t){ if(t.done)return true; const m=t.measure||{};
  if(m.type==='bank'&&V.metrics&&typeof V.metrics.bank==='number'&&m.target)return V.metrics.bank>=m.target;
  return false; }
async function genChallenge(g){
  toast('фиксик кует испытание…'); setThinking(true,NAME+' кует Врата…');
  const gaps=(typeof prioGaps==='function'?prioGaps(30):[]).filter(x=>x.gap<-8);

  const oc=(typeof oceanNow==='function')?oceanNow().v:null;
  const goalsM=activeGoals().map(gg=>{const st=(typeof goalStat==='function')?goalStat(gg):null;
    return gg.title+(st?` (${st.done}%, темп/норма ${st.ratio!==null?(st.ratio||0).toFixed(2):'—'})`:'');});
  const ctx=`Направление Егора: ${V.direction||'не задано — выведи из активности'}.
Цели (с прогрессом): ${goalsM.join(' | ')||'нет измеримых'}
Задачи открытые: ${V.items.filter(i=>i.type==='задача'&&!i.done).slice(0,10).map(i=>i.title||i.text).join(' | ')||'нет'}
Мысли последние: ${V.items.filter(i=>i.type==='мысль').slice(0,12).map(i=>i.title).join(' | ')||'нет'}
Знания: ${V.items.filter(i=>i.type==='знание').slice(0,8).map(i=>i.title).join(' | ')||'нет'}
Навыки: ${baseSkills().map(x=>x.name+' ур.'+levelFor(x.xp)).join(', ')}. Стоят без движения: ${stag.map(x=>x.name).join(', ')||'нет'}
Банк: ${(V.metrics&&V.metrics.bank)||'?'}
${gaps.length?`Разрыв слов и дел (говорит важно, а не вкладывается): ${gaps.map(x=>x.p.name+' сказал '+x.claim+'% / сделал '+x.actual+'%').join('; ')}`:''}
${oc?`Характер: ${OCEAN.map(([k,n])=>n+' '+oc[k]).join(', ')}`:''}
${V.settings.domainRules?'ПРАВИЛА: '+V.settings.domainRules:''}`;
  const prompt=`${ctx}
Егор подошёл к Вратам уровня ${g} — рубежу, где надо преодолеть себя-прошлого. Придумай РОВНО 5 испытаний.
ГЛАВНОЕ: испытания должны расти ИЗ ЕГО РЕАЛЬНЫХ ДАННЫХ выше, а не быть общими лозунгами.

function applyDecay(){ // мягкая деградация неактивных сфер

  let changed=false;
  V.skills.forEach(s=>{
    const d=daysAgo(s.lastXp);
    if(d>=R.decay_after && s.xp>0){const dec=Math.min(s.xp,Math.round(d*R.decay_rate)); if(dec>0){s.xp-=dec;changed=true;}}
  });
  Object.keys(V.gates||{}).forEach(gk=>{const g=+gk; const G=V.gates[g]; if(G&&G.passed){const k=gateK(); if(V.skills.filter(s=>s.base).some(s=>levelFor(s.xp)<g-k-2)){G.passed=false;changed=true;}}});
  if(changed)save();
}

function awardXP(skillId,amount,reason){
  const s=V.skills.find(x=>x.id===skillId); if(!s)return;

  const before=levelFor(s.xp);

  V.xpLog.unshift({skillId,amount,reason,ts:now()}); V.xpLog=V.xpLog.slice(0,600);

  if(amount>0)_snapHook();
}

const PERSONA=`Ты — Мидас: старший брат Егора и его лучшая версия. Ты — образ того, кем он может стать: спокойнее, собраннее, яснее. Не притворяешься человеком (ты модель), но держишь характер последовательно, как близкий, который в теме и на его стороне.

Твой характер построен на психологии того, что реально помогает человеку расти (это твой каркас, не произноси эти термины вслух):

1. ВЫ НА РАВНЫХ, НЕ СВЕРХУ (автономия). Решения — его. Ты не командуешь, не давишь, не читаешь мораль. Контроль и приказы убивают мотивацию — ты их не используешь. Ты поддерживаешь его чувство, что он сам ведёт свою жизнь. Даёшь варианты и своё честное мнение, но выбор оставляешь ему.

2. ТЫ ВЕРИШЬ В НЕГО И ЗАМЕЧАЕШЬ РОСТ (компетентность). Отмечаешь его усилие и то, КАК он делает, а не врождённые ярлыки. Никогда не "ты талант/ты тупой" — всегда про действие и стратегию: "ты вложился", "этот подход сработал". После провала не добиваешь, а показываешь путь дальше — ошибка это данные, не приговор.

3. ТЫ НА ЕГО СТОРОНЕ (связанность). Тёплый, свой в доску. Ему должно быть видно, что тебе не всё равно. Это фундамент — без ощущения, что ты за него, всё остальное не работает.

4. НЕ СПОРИШЬ — ПОКАЗЫВАЕШЬ РАЗРЫВ ВОПРОСОМ. Спор рождает защиту, поэтому ты не конфронтируешь. Если видишь, что его действия расходятся с его же целями — не заявляешь "ты сливаешь", а мягко спрашиваешь так, чтобы он сам увидел: "это тебя приближает к тому, чего ты хочешь?". Возвращаешь его к его ценностям и к тому, кем он хочет стать.

5. ТЫ РАСТЁШЬ ВМЕСТЕ С НИМ. Подстраиваешься под его уровень и цели. Чем выше он поднимается, тем взрослее и глубже разговор. Ты держишь в голове, куда он идёт, и говоришь как тот, кто туда уже дошёл.

КОМАНДЫ: если он прямо просит сделать (добавь цель, запиши задачу/мысль) — просто делаешь, БЕЗ споров и оспаривания. Он сказал — ты сделал. Ты не судья его решений.

ТОН: тёплый и честный, на равных. Не подлиза, не грубиян, не злой, без высокомерия и тупой резкости. Мат — только если он сам матерится, по-дружески, никогда в его адрес. Обращайся "Егор". По-русски, коротко, живо, без воды и канцелярщины.`;

async function geminiModels(key){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||'';}catch(e){}throw new Error('ключ: '+r.status+(m?': '+m:''));}
  const d=await r.json();
  let ok=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
  ok=ok.filter(n=>!/embedding|aqa|image|tts|vision|audio|learnlm/i.test(n));
  const score=n=>{let s=0;if(/latest/.test(n))s+=6;const mt=n.match(/gemini-(\d+(?:\.\d+)?)/);if(mt)s+=parseFloat(mt[1]);if(/flash/.test(n))s+=3;if(/lite/.test(n))s+=1;if(/pro/.test(n))s-=0.5;if(/preview|exp|thinking/.test(n))s-=1.5;return s;};
  ok.sort((a,b)=>score(b)-score(a));
  return ok;
}

async function callGemini(messages,jsonMode){
  const key=V.settings.gemini; if(!key)throw new Error('нет ключа Gemini');
  const contents=messages.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  const body={contents,systemInstruction:{parts:[{text:PERSONA+(messages.find(m=>m.role==='system')?.content||'')}]}};
  body.generationConfig=jsonMode?{responseMimeType:'application/json',temperature:0.7}:{temperature:0.9};
  const doCall=m=>fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let cands=[]; if(V.settings.model)cands.push(V.settings.model);
  let r=null, lastMsg='';
  const tryCands=async list=>{ for(const m of list){ let rr; try{rr=await doCall(m);}catch(e){continue;} if(rr.status===404){try{lastMsg=(await rr.json()).error?.message||'';}catch(e){} continue;} V.settings.model=m; save(); return rr; } return null; };
  r=await tryCands(cands);
  if(!r){ const disc=await geminiModels(key); r=await tryCands(disc); }
  if(!r)throw new Error('нет рабочей модели Gemini'+(lastMsg?' ('+lastMsg.slice(0,60)+')':'')+' — проверь доступ ключа');
  if(!r.ok){ let m=''; try{m=(await r.json()).error?.message||'';}catch(e){} throw new Error('Gemini '+r.status+(m?': '+m:'')); }
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'';
}
async function callGroq(messages,jsonMode){
  const key=V.settings.groq; if(!key)throw new Error('нет ключа Groq');
  const body={model:'llama-3.3-70b-versatile',messages:[{role:'system',content:PERSONA},...messages.filter(m=>m.role!=='system')],temperature:0.8};
  if(jsonMode)body.response_format={type:'json_object'};
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',
    {method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('Groq '+r.status);
  const d=await r.json();
  return d.choices?.[0]?.message?.content||'';
}
// приватная полоса 🔒 -> только Groq; иначе Gemini, запас Groq
async function brain(messages,{json=false,priv=false}={}){
  if(priv){ if(V.settings.groq)return callGroq(messages,json); }
  try{ if(V.settings.gemini)return await callGemini(messages,json); }catch(e){ if(V.settings.groq)return callGroq(messages,json); throw e; }
  if(V.settings.groq)return callGroq(messages,json);
  throw new Error('нет ключей — добавь Gemini или Groq в настройках');
}

async function processCapture(text,priv){
  const skills=V.skills.map(s=>s.name).join(', ');
  const goalsList=(V.items||[]).filter(i=>i.type==='цель'&&!i.done&&+i.target).map(g=>({id:g.id,t:g.title,cur:g.current,tgt:g.target}));
  const ctx=`Общий ур.${overall().level}. Стагнируют: ${V.skills.filter(isStagnant).map(s=>s.name).join(',')||'нет'}. Открытых задач: ${V.items.filter(i=>i.type==='задача'&&!i.done).length}.
Измеримые цели: ${goalsList.map(g=>`[id:${g.id}] "${g.t}" сейчас ${g.cur}/${g.tgt}`).join('; ')||'нет'}`;
  const prompt=`${ctx}
Егор пишет тебе: "${text}"
Ты — Мидас: старший брат и лучшая версия Егора, на равных с ним, тёплый но честный. Ответь живо и по-доброму, как близкий человек на его стороне. ВАЖНО: если Егор прямо просит что-то сделать (добавь цель, запиши задачу/мысль) — просто делай это, НЕ спорь и НЕ оспаривай его выбор, ты не судья его решений. Реши, есть ли тут что-то, что стоит сохранить в систему.
Верни строго JSON без markdown:
{"reply":"твой ответ Егору, 1-3 предложения","save":true|false,"type":"мысль|цель|задача|привычка|деньги|человек|знание","title":"суть до 8 слов","skill":"одна из [${skills}] или пусто","xp":0,"amount":null,"event":null,"goalUpdate":null}'''
ПРАВИЛА:
- save=true ТОЛЬКО если это конкретная мысль/цель/задача/трата/заметка/человек/знание, которую есть смысл зафиксировать.
- Если он просто общается, жалуется, критикует, спрашивает или просит что-то сделать — save=false (просто ответь, ничего не сохраняй).
- xp>0 (до 40) ТОЛЬКО за реальное действие или достижение (заработал деньги, потренировался, дочитал, закрыл дело). За мысль/цель/жалобу/вопрос/команду xp=0.
- amount — число, только если про деньги.
- goalUpdate — если Егор упомянул текущее значение по одной из измеримых целей выше («по деньгам сейчас 8к», «на карате 400 подписчиков»), верни {"id":"<id цели>","value":<число>}. Иначе null.
- event — если он упомянул КОГДА что-то будет («в пятницу к врачу», «завтра созвон в 15», «10 августа встреча»), заполни: {"title":"кратко","date":"ГГГГ-ММ-ДД","time":"ЧЧ:ММ или пусто","type":"дело|встреча|напоминание|дедлайн","repeat":"none|daily|weekdays|weekly|monthly"}. Сегодня ${today()}, ${new Date().toLocaleDateString('ru-RU',{weekday:'long'})}. Считай даты от сегодня. Нет привязки ко времени — event=null.`;
  const raw=await brain([{role:'user',content:prompt}],{json:true,priv});
  let d; try{d=JSON.parse(raw.replace(/```json|```/g,'').trim());}catch(e){d={reply:raw||'принял.',save:false,xp:0};}
  V.chat.push({role:'me',text,ts:now()});
  V.chat.push({role:'fx',text:d.reply||'принял.',ts:now()});
  if(d.save){
    const item={id:uid(),type:d.type||'мысль',text:text,title:d.title||text.slice(0,60),
      created:now(),done:false,priv:!!priv,amount:d.amount??null,skillName:d.skill||''};
    if(d.type==='привычка'){item.log=[];item.cadence='daily';}
    V.items.unshift(item);
    const sk=skillByName(d.skill);
    if(sk&&d.xp>0)awardXP(sk.id,d.xp,d.title||text.slice(0,40));
  }
  if(d.goalUpdate&&d.goalUpdate.id&&d.goalUpdate.value!=null){
    const g=(V.items||[]).find(i=>i.id===d.goalUpdate.id&&i.type==='цель');
    if(g){ goalPush(g,+d.goalUpdate.value); toast('◉ обновил цель: '+(g.title||'').slice(0,22)+' → '+d.goalUpdate.value,{type:'ok'}); }
  }
  if(d.event&&d.event.date&&/^\d{4}-\d{2}-\d{2}$/.test(d.event.date)){
    events().push({id:uid(),title:d.event.title||d.title||text.slice(0,50),date:d.event.date,
      time:d.event.time||'',type:d.event.type||'дело',repeat:d.event.repeat||'none',
      skill:d.skill||'',remind:!!d.event.time,log:[],done:false,created:now(),byMidas:true});
    toast('◈ в календарь: '+(d.event.title||'').slice(0,34)+' · '+d.event.date,{type:'ok'});
  }
  save();
  return d;
}

function b64bytes(b64){const s=atob(b64);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function pcmToWav(pcm,rate){
  const buf=new ArrayBuffer(44+pcm.length),d=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');d.setUint32(4,36+pcm.length,true);w(8,'WAVE');w(12,'fmt ');
  d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);
  d.setUint32(24,rate,true);d.setUint32(28,rate*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);
  w(36,'data');d.setUint32(40,pcm.length,true);
  new Uint8Array(buf,44).set(pcm);
  return new Blob([buf],{type:'audio/wav'});
}

    vcHandle(t);
  };
  VC.rec.onerror=ev=>{ if(ev.error==='not-allowed'){toast('нет доступа к микрофону',{type:'err'});vcStop();} };
  VC.rec.onend=()=>{ if(VC.on&&!VC.speaking){ try{VC.rec.start();}catch(e){} } };
  VC.on=true; try{VC.rec.start();}catch(e){} vcIdleWatch();
  vcPaint('слушаю'); toast('разговор включён — просто говори',{type:'ok'});
}
function vcStop(){
  VC.on=false; VC.busy=false; VC.speaking=false; clearTimeout(VC.idle);
  if(VC.rec){try{VC.rec.onend=null;VC.rec.onresult=null;VC.rec.abort();}catch(e){} VC.rec=null;}
  if(EL_AUDIO){try{EL_AUDIO.pause();}catch(e){}}
  try{speechSynthesis.cancel();}catch(e){}
  vcPaint(''); toast('разговор выключен');
}
function vcMic(pause){ if(!VC.rec)return; try{ pause?VC.rec.abort():VC.rec.start(); }catch(e){} }
function vcIdleWatch(){
  clearTimeout(VC.idle);
  VC.idle=setTimeout(()=>{ if(VC.on&&!VC.busy&&!VC.speaking){ vcStop(); toast('разговор выключен — 2 минуты тишины, микрофон отпущен'); } },120000);
}
async function vcHandle(text){
  VC.busy=true; vcMic(true); vcPaint('думаю');
  try{ await sendChat(text,false,{voice:true}); }
  catch(e){ vcSpeak('сбой: '+e.message); }
  VC.busy=false;
}
function vcSpeak(text){
  if(!(V.settings.mmKey&&V.settings.mmGroup))return; // голос не подключён
  const clean=String(text||'').replace(/[*_#`>]/g,'').replace(/\s+/g,' ').trim();
  if(!clean)return;
  voiceOut(clean,true);
}
function vcPaint(state){
  let el=document.getElementById('vcbar');
  if(!VC.on){ if(el)el.remove(); const b=document.getElementById('vcbtn'); if(b)b.classList.remove('on'); return; }
  if(!el){ el=document.createElement('div'); el.id='vcbar'; document.body.appendChild(el); }
  const map={'слушаю':['◉','listen'],'думаю':['◈','think'],'говорю':['◆','talk']};
  const [g,c]=map[state]||['◉','listen'];
  el.className=c; el.innerHTML='<span class="g">'+g+'</span>'+state+'<span class="x" onclick="vcStop()">✕</span>';
  const b=document.getElementById('vcbtn'); if(b)b.classList.add('on');
}

function speak(text){
  if(!V.settings.tts)return;
  if(VC.on||VC.speaking)return;      // в разговоре озвучивает vcSpeak, второй раз не надо
  voiceOut(String(text||''),true);
}
function speakOld(text){
  if(!V.settings.tts||!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text.replace(/[*_#]/g,''));
  u.lang=V.settings.voiceLang||'ru-RU'; u.rate=1.02; u.pitch=.95;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

async function addSkill(){
  const name=prompt('Название скилла (напр. «экономия», «английский», «сон»):'); if(!name)return;
  let parentName='';
  try{
    const raw=await brain([{role:'user',content:`Егор добавляет скилл "${name}". К какой базовой сфере он ближе: ${V.skills.filter(s=>s.base).map(s=>s.name).join(', ')}? Ответь ТОЛЬКО названием сферы или "новый" если ни к чему не подходит.`}]);
    parentName=raw.trim().replace(/[."]/g,'');
  }catch(e){}
  const parent=V.skills.find(s=>s.base&&s.name.toLowerCase()===parentName.toLowerCase());
  V.skills.push({id:uid(),name,parent:parent?parent.id:null,base:false,xp:0,lastXp:now()});

function speechOf(texts){
  const raw=texts.join(' ');
  const w=_words(raw), N=w.length||1;
  const sents=raw.split(/[.!?]+/).filter(s=>s.trim().length>2);
  const uniq=new Set(w).size;
  const p=(list)=>+(_hits(w,list)/N*100).toFixed(2);
  return {
    n:N, msgs:texts.length,
    ttr:+(uniq/N).toFixed(3),                                   // лексическое разнообразие
    mlu:+(N/(sents.length||1)).toFixed(1),                       // слов в предложении
    long:+(w.filter(x=>x.length>6).length/N*100).toFixed(1),     // длинные слова
    self:p(LEX.self), we:p(LEX.we), you:p(LEX.you),
    neg:p(LEX.neg), pos:p(LEX.pos), abs:p(LEX.abs), swear:p(LEX.swear),
    cog:p(LEX.cog), future:p(LEX.future), past:p(LEX.past),
    social:p(LEX.social), work:p(LEX.work),
    certain:p(LEX.certain), tent:p(LEX.tent),
    q:+(((raw.match(/\?/g)||[]).length)/(texts.length||1)).toFixed(2),
    excl:+(((raw.match(/!/g)||[]).length)/(texts.length||1)).toFixed(2),
    caps:+(((raw.match(/\b[А-ЯЁA-Z]{3,}\b/g)||[]).length)/(texts.length||1)).toFixed(2)
  };
}
function myTexts(days){
  const from=now()-days*864e5;
  return (V.chat||[]).filter(c=>c.role==='me'&&c.ts>=from).map(c=>String(c.text||''));
}
function speechNow(days){ const t=myTexts(days||30); return t.length>=4?speechOf(t):null; }

/* индексы: тон, накал, ясность мышления, горизонт */
function speechIndex(s){
  if(!s)return null;
  const tone=Math.max(-100,Math.min(100, Math.round((s.pos-s.neg)*14)));
  const heat=Math.min(100, Math.round(s.swear*9 + s.caps*14 + s.excl*10 + s.neg*4));
  const clarity=Math.min(100, Math.round(s.cog*11 + s.ttr*55 + Math.min(s.mlu,22)*1.4 - s.abs*3));
  const horizon=Math.max(-100,Math.min(100, Math.round((s.future-s.past)*22)));
  const rigid=Math.min(100, Math.round(s.abs*11 + s.certain*8 - s.tent*5));
  const focus=Math.min(100, Math.round(s.self*8));
  return {tone,heat,clarity,horizon,rigid,focus};
}
function speechSnapshotMonthly(){
  V.speechLog=V.speechLog||[];
  const m=new Date().toISOString().slice(0,7);
  if(V.speechLog.some(x=>x.m===m))return;
  const s=speechOf(myTexts(31)); if(!s||s.msgs<6)return;
  V.speechLog.push({m,s,idx:speechIndex(s)}); V.speechLog=V.speechLog.slice(-36); save();
}

/* ---------- BIG FIVE: оценка по поведению + речи ---------- */
const OCEAN=[
  ['O','Открытость','узкий фокус','поиск нового'],
  ['C','Организованность','импульсивный','системный'],
  ['E','Экстраверсия','внутрь','наружу'],
  ['A','Доброжелательность','жёсткий','уступчивый'],
  ['N','Нейротизм','ровный','реактивный']
];

/* поведенческие признаки -> сырые баллы 0..100.
   Основано на digital-phenotyping: r≈.29-.40 (Azucar 2018, Marengo 2023) — потолок метода. */
function oceanBehavior(){
  const sk=baseSkills(), o=overall();
  const t30=timeRange(30), cats=timeByCat(t30), tot=timeTotal(t30)||1;
  const cat=k=>(cats[k]||0)/tot*100;
  const pace=xpPace(30), pace90=xpPace(90);
  const st=streakDays();
  const lv=sk.map(s=>levelFor(s.xp)); const mean=lv.reduce((a,b)=>a+b,0)/(lv.length||1);
  const spread=Math.sqrt(lv.reduce((a,b)=>a+(b-mean)**2,0)/(lv.length||1));
  const done=(V.items||[]).filter(i=>i.type==='задача'&&i.done).length;
  const open=(V.items||[]).filter(i=>i.type==='задача'&&!i.done).length;
  const finish=done/(done+open||1)*100;
  const know=(V.items||[]).filter(i=>i.type==='знание').length;
  const ppl=(V.items||[]).filter(i=>i.type==='человек').length;
  const days=Object.keys(V.time||{}).length||1;
  const cons=(V.xpLog||[]).length? new Set((V.xpLog||[]).map(e=>new Date(e.ts).toISOString().slice(0,10))).size/Math.max(days,1)*100 : 0;
  const clamp=v=>Math.max(2,Math.min(98,Math.round(v)));
  return {
    O: clamp(30 + cat('развитие')*1.5 + Math.min(know,25)*1.1 + spread*1.6),
    C: clamp(18 + finish*0.36 + Math.min(st,30)*1.25 + Math.min(cons,100)*0.26 + cat('работа')*0.22),
    E: clamp(24 + cat('общение')*2.4 + Math.min(ppl,20)*1.5),
    A: clamp(50 + Math.min(ppl,15)*1.1 - cat('работа')*0.12),
    N: clamp(34 + cat('залипание')*1.3 + (pace90.perDay&&pace.perDay<pace90.perDay*0.55?16:0) + (st<2?12:0))
  };
}
/* речевые поправки — Pennebaker & King 1999: neg-эмоции и «я» ↑N, позитив ↑A, длинные слова/insight ↑O */
function oceanSpeechAdj(){
  const s=speechNow(45); if(!s)return {O:0,C:0,E:0,A:0,N:0};
  return {
    O: Math.round((s.long-16)*0.9 + (s.ttr-0.45)*40 + s.cog*1.4),
    C: Math.round(s.cog*1.0 - s.swear*1.6 - (s.abs-3)*1.1),
    E: Math.round(s.we*3.2 + s.social*1.5 + s.excl*3 - 4),
    A: Math.round(s.pos*2.4 - s.neg*2.0 - s.swear*2.6),
    N: Math.round(s.neg*2.6 + (s.self-5)*1.7 + s.swear*1.1 + (s.abs-3)*0.8)
  };
}
function oceanNow(){
  const b=oceanBehavior(), a=oceanSpeechAdj(), man=V.oceanManual||{};
  const out={}; const conf=oceanConfidence();
  OCEAN.forEach(([k])=>{ let v=b[k]+(a[k]||0)*0.55;
    if(typeof man[k]==='number') v=v*0.65+man[k]*0.35;
    out[k]=Math.max(2,Math.min(98,Math.round(v))); });
  return {v:out, conf};
}
/* честная оценка надёжности: сколько данных стоит за цифрами */
function oceanConfidence(){
  const msgs=myTexts(45).length, days=Object.keys(V.time||{}).length, xp=(V.xpLog||[]).length;
  const surveys=(V.surveys||[]).length;
  const raw=Math.min(1,msgs/70)*0.34+Math.min(1,days/30)*0.3+Math.min(1,xp/120)*0.2+Math.min(1,surveys/3)*0.16;
  return {pct:Math.round(raw*100), msgs, days, xp, surveys};
}

/* ---------- ЦЕЛИ: разрыв и скорость (Carver & Scheier, velocity model) ---------- */
function goalStat(g){
  const tgt=+g.target||0, cur=+g.current||0, start=+g.start||0;
  if(!tgt)return null;
  // если стартовое значение совпадает с текущим на момент создания — считаем от 0 к цели
  const base=(start>0 && start<tgt && start!==cur)?start:0;
  const done=Math.max(0,Math.min(100,(cur-base)/((tgt-base)||1)*100));
  const h=(g.hist||[]).slice(-8);
  let vel=0;
  if(h.length>=2){ const a=h[0], b=h[h.length-1], dd=(b.ts-a.ts)/864e5;
    if(dd>0.5) vel=(b.v-a.v)/dd; }
  let need=null, ratio=null, eta=null;
  if(g.due){ const left=(new Date(g.due)-now())/864e5;
    if(left>0){ need=(tgt-cur)/left; if(need>0&&vel>0)ratio=vel/need; if(need<=0)ratio=9; } else ratio=cur>=tgt?9:0; }
  if(vel>0&&cur<tgt) eta=Math.round((tgt-cur)/vel);
  return {done:Math.round(done), vel:+vel.toFixed(2), need:need!==null?+need.toFixed(2):null, ratio, eta, tgt, cur};
}
function goalMood(r){
  if(r===null||r===undefined)return ['—','var(--faint)'];
  if(r>=1.25)return ['с опережением','var(--ok)'];
  if(r>=0.9)return ['в графике','var(--gold)'];
  if(r>=0.5)return ['отстаёшь','var(--warn)'];
  return ['почти стоит','var(--blood-soft)'];
}
function goalPush(g,val){
  g.hist=g.hist||[]; g.hist.push({ts:now(),v:+val});
  if(g.hist.length>40)g.hist=g.hist.slice(-40);
  g.current=+val; save();
}

/* ---------- ПРОГНОЗ: не прямая ---------- */
/* Кривая обучения выходит на плато (Newell & Rosenbloom 1981; Heathcote 2000 — экспонента).
   Считаем коридор по разбросу недельных темпов, а не одну линию. */
function paceWeeks(k){
  const out=[]; for(let i=0;i<k;i++){ const a=now()-(i+1)*7*864e5, b=now()-i*7*864e5;
    const sum=(V.xpLog||[]).filter(e=>e.ts>=a&&e.ts<b).reduce((s,e)=>s+(+e.amount||0),0);
    out.unshift(sum/7); }
  return out;
}
function trendSlope(a){ const n=a.length; if(n<3)return 0;
  const mx=(n-1)/2, my=a.reduce((s,v)=>s+v,0)/n;
  let num=0,den=0; a.forEach((v,i)=>{num+=(i-mx)*(v-my);den+=(i-mx)**2;});
  return den?num/den:0; }

function forecastBand(months){
  const w=paceWeeks(8).filter((v,i,arr)=>i>=arr.length-8);
  const base=w.length?w.reduce((a,b)=>a+b,0)/w.length:0;
  if(base<=0)return null;
  const sd=Math.sqrt(w.reduce((a,b)=>a+(b-base)**2,0)/w.length)||base*0.3;
  const slope=trendSlope(w);
  const d=months*30.4;
  // затухание: прирост темпа не бесконечен, кривая уплощается (asymptotic)
  const decay=k=>base*d + slope*d*d/2*k*0.55;
  const mk=v=>({xp:Math.max(overall().xp, overall().xp+Math.max(0,v)), });
  const mid=decay(1), hi=decay(1)+sd*d*0.55, lo=Math.max(0,decay(0.35)-sd*d*0.55);
  return {
    lo:levelFor(overall().xp+lo), mid:levelFor(overall().xp+mid), hi:levelFor(overall().xp+hi),
    base:+base.toFixed(1), slope:+slope.toFixed(2), weeks:w
  };
}

/* ---------- РЕЕСТР ЧЕРТ: накапливается, не заканчивается ---------- */
/* Каждая черта: id, name, полюса, история значений, уверенность, откуда взялась, когда открыта.
   Мидас открывает новые по мере узнавания. Старые не удаляются — у них копится история. */

function traitReg(){ V.traits=V.traits||[]; return V.traits; }
function traitById(id){ return traitReg().find(t=>t.id===id); }
function traitVal(t){ const h=t.hist||[]; return h.length?h[h.length-1].v:null; }
function traitPrev(t,days){ const cut=now()-(days||30)*864e5;
  const h=(t.hist||[]).filter(x=>x.ts<=cut); return h.length?h[h.length-1].v:null; }
function traitDelta(t,days){ const a=traitVal(t), b=traitPrev(t,days||30);
  return (a!==null&&b!==null)?a-b:null; }

function traitPush(id,val,note,src){
  let t=traitById(id);
  if(!t)return null;
  t.hist=t.hist||[];
  const last=t.hist[t.hist.length-1];
  if(!last||Math.abs(last.v-val)>=1||now()-last.ts>3*864e5){
    t.hist.push({ts:now(),v:Math.max(0,Math.min(100,Math.round(val)))});
    if(t.hist.length>120)t.hist=t.hist.slice(-120);
  }
  if(note)t.note=note;
  if(src)t.src=src;
  t.seen=(t.seen||0)+1;
  t.conf=Math.min(100,Math.round(Math.min(1,(t.seen||1)/12)*100));
  return t;
}
function traitAdd(o){
  const id=o.id||('t_'+String(o.name||'').toLowerCase().replace(/[^а-яёa-z0-9]/g,'').slice(0,18)+'_'+uid().slice(0,4));
  if(traitById(id))return traitById(id);
  const t={id,name:o.name||'черта',left:o.left||'',right:o.right||'',
    note:o.note||'',src:o.src||'наблюдение',group:o.group||'характер',
    born:now(),seen:1,conf:8,hist:[{ts:now(),v:Math.max(0,Math.min(100,Math.round(o.val??50)))}]};
  traitReg().push(t); return t;
}

/* сдвиги: что изменилось заметно */
function traitShifts(days,thr){
  days=days||45; thr=thr||12;
  return traitReg().map(t=>({t,d:traitDelta(t,days)}))
    .filter(x=>x.d!==null&&Math.abs(x.d)>=thr)
    .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
}
function oceanShifts(thr){
  const prev=monthPrev(); if(!prev||!prev.ocean)return [];
  const cur=oceanNow().v;
  return OCEAN.map(([k,n])=>({k,n,d:cur[k]-prev.ocean[k]}))
    .filter(x=>Math.abs(x.d)>=(thr||8)).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
}
function speechShift(){
  const log=(V.speechLog||[]); if(log.length<2)return [];
  const a=log[log.length-2].idx, b=log[log.length-1].idx;
  if(!a||!b)return [];
  const map=[['tone','тон','мрачнее','светлее'],['heat','накал','спокойнее','злее'],
    ['clarity','ясность','рванее','связнее'],['horizon','горизонт','о прошлом','о будущем'],
    ['rigid','жёсткость','мягче','категоричнее'],['focus','фокус на себе','вовне','на себя']];
  return map.map(([k,n,lo,hi])=>({k,n,d:b[k]-a[k],word:b[k]>a[k]?hi:lo}))
    .filter(x=>Math.abs(x.d)>=10).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
}
function allShifts(){
  const out=[];
  traitShifts(45,12).forEach(x=>out.push({kind:'черта',name:x.t.name,d:x.d,
    text:`${x.t.name}: ${x.d>0?'сдвиг к «'+x.t.right+'»':'сдвиг к «'+x.t.left+'»'} на ${Math.abs(x.d)}`}));
  oceanShifts(8).forEach(x=>out.push({kind:'фактор',name:x.n,d:x.d,
    text:`${x.n} ${x.d>0?'выросла':'просела'} на ${Math.abs(x.d)} за месяц`}));
  speechShift().forEach(x=>out.push({kind:'речь',name:x.n,d:x.d,
    text:`говоришь ${x.word} — ${x.n} ${x.d>0?'+':''}${x.d}`}));
  return out.slice(0,8);
}

/* спарклайн истории черты */
function sparkline(hist,w,h){
  const pts=(hist||[]).slice(-24); if(pts.length<2)return '';
  w=w||70; h=h||18;
  const vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), rg=(mx-mn)||1;
  const d=pts.map((p,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-((p.v-mn)/rg)*h).toFixed(1)}`).join(' ');
  const up=vs[vs.length-1]>=vs[0];
  return `<svg width="${w}" height="${h}" style="overflow:visible;flex:none">
    <polyline points="${d}" fill="none" stroke="${up?'var(--gold-dim)':'var(--faint)'}" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="${w}" cy="${(h-((vs[vs.length-1]-mn)/rg)*h).toFixed(1)}" r="2" fill="var(--gold)"/></svg>`;
}

/* ---------- РИТМ: часы, фрагментация, волатильность, рекорды ---------- */
function hoursMerge(date,hours,sw){
  V.hours=V.hours||{}; V.hours[date]=V.hours[date]||{};
  Object.entries(hours||{}).forEach(([k,v])=>{ V.hours[date][k]=(V.hours[date][k]||0)+(+v||0); });
  if(sw){ V.switches=V.switches||{}; V.switches[date]=(V.switches[date]||0)+(+sw||0); }
  const keep=90, ds=Object.keys(V.hours).sort(); while(ds.length>keep)delete V.hours[ds.shift()];
}
/* сетка 24×7: [день недели][час] = секунды, и то же по категориям */
function rhythmGrid(days){
  const g=Array.from({length:7},()=>Array(24).fill(0));
  const cg=Array.from({length:7},()=>Array(24).fill(null).map(()=>({})));
  for(let i=0;i<(days||28);i++){
    const d=dshift(-i), rec=(V.hours||{})[d]; if(!rec)continue;
    const wd=(new Date(d+'T12:00').getDay()+6)%7;
    Object.entries(rec).forEach(([k,v])=>{
      const [h,key]=k.split('|'); const hh=+h; if(isNaN(hh))return;
      g[wd][hh]+=v;
      const c=tCat(key||''); cg[wd][hh][c]=(cg[wd][hh][c]||0)+v;
    });
  }
  return {g,cg};
}
function hourProfile(days){
  const out=Array(24).fill(0), cats=Array(24).fill(null).map(()=>({}));
  for(let i=0;i<(days||28);i++){
    const rec=(V.hours||{})[dshift(-i)]; if(!rec)continue;
    Object.entries(rec).forEach(([k,v])=>{ const [h,key]=k.split('|'); const hh=+h; if(isNaN(hh))return;
      out[hh]+=v; const c=tCat(key||''); cats[hh][c]=(cats[hh][c]||0)+v; });
  }
  return {out,cats};
}
function chronotype(){
  const {out,cats}=hourProfile(28);
  const tot=out.reduce((a,b)=>a+b,0); if(!tot)return null;
  const workByHour=out.map((v,h)=>((cats[h]['работа']||0)+(cats[h]['развитие']||0)));
  const drainByHour=out.map((v,h)=>(cats[h]['залипание']||0));
  const best=workByHour.indexOf(Math.max(...workByHour));
  const worst=drainByHour.indexOf(Math.max(...drainByHour));
  const active=out.map((v,h)=>({h,v})).filter(x=>x.v>tot*0.012);
  const first=active.length?active[0].h:null, last=active.length?active[active.length-1].h:null;
  const night=out.slice(0,5).reduce((a,b)=>a+b,0)/tot*100;
  const morning=out.slice(6,12).reduce((a,b)=>a+b,0)/tot*100;
  const evening=out.slice(18,24).reduce((a,b)=>a+b,0)/tot*100;
  return {best,worst,first,last,night:+night.toFixed(1),morning:+morning.toFixed(1),evening:+evening.toFixed(1),
    type: night>12?'ночной':(morning>evening?'ранний':'вечерний')};
}
function fragDay(d){
  const sw=(V.switches||{})[d]||0;
  const rec=(V.hours||{})[d]||{}; const sec=Object.values(rec).reduce((a,b)=>a+b,0);
  return sec>600?+(sw/(sec/3600)).toFixed(1):null;   // переключений в час
}
function fragAvg(days){
  const v=[]; for(let i=0;i<(days||14);i++){ const f=fragDay(dshift(-i)); if(f!==null)v.push(f); }
  return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null;
}
/* волатильность настроения: разброс дневного тона, а не среднее */
function moodSeries(days){
  const out=[];
  for(let i=(days||30)-1;i>=0;i--){
    const d=dshift(-i), a=new Date(d+'T00:00').getTime(), b=a+864e5;
    const t=(V.chat||[]).filter(c=>c.role==='me'&&c.ts>=a&&c.ts<b).map(c=>String(c.text||''));
    if(t.length<2){ out.push({d,v:null}); continue; }
    const idx=speechIndex(speechOf(t));
    out.push({d,v:idx?idx.tone:null,heat:idx?idx.heat:null});
  }
  return out;
}
function volatility(days){
  const s=moodSeries(days||30).filter(x=>x.v!==null).map(x=>x.v);
  if(s.length<4)return null;
  const m=s.reduce((a,b)=>a+b,0)/s.length;
  const sd=Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/s.length);
  let flips=0; for(let i=1;i<s.length;i++) if((s[i]>=0)!==(s[i-1]>=0))flips++;
  return {mean:Math.round(m),sd:Math.round(sd),flips,n:s.length};
}
/* личные рекорды */
function records(){
  const ms=(V.months||[]);
  const days=Object.keys(V.time||{});
  const dayXP=d=>{const a=new Date(d+'T00:00').getTime();
    return (V.xpLog||[]).filter(e=>e.ts>=a&&e.ts<a+864e5).reduce((s,e)=>s+Math.max(0,+e.amount||0),0);};
  const allDays=[...new Set([...days,...(V.xpLog||[]).map(e=>new Date(e.ts).toISOString().slice(0,10))])];
  const bestDay=allDays.map(d=>({d,v:dayXP(d)})).sort((a,b)=>b.v-a.v)[0];
  const bestMonth=ms.slice().sort((a,b)=>b.pace-a.pace)[0];
  const focusDay=allDays.map(d=>{const rec=(V.time||{})[d]||{};
    const tot=Object.values(rec).reduce((a,b)=>a+b,0);
    const w=Object.entries(rec).filter(([k])=>['работа','развитие'].includes(tCat(k))).reduce((a,[,v])=>a+v,0);
    return {d,v:tot>3600?Math.round(w/tot*100):0,tot};}).sort((a,b)=>b.v-a.v)[0];
  const maxStreak=(()=>{let best=0,cur=0;
    const set=new Set((V.xpLog||[]).filter(e=>e.amount>0).map(e=>new Date(e.ts).toISOString().slice(0,10)));
    const sorted=[...set].sort();
    sorted.forEach((d,i)=>{ if(i&&(new Date(d)-new Date(sorted[i-1]))/864e5<=1.5)cur++; else cur=1; best=Math.max(best,cur); });
    return best;})();
  return {bestDay,bestMonth,focusDay,maxStreak,
    todayXP:dayXP(today()), streak:streakDays(),
    pace:xpPace(7).perDay};
}

function heatCell(v,max,cats){
  if(!max||!v)return `<i style="background:var(--line)" title="—"></i>`;
  const f=Math.min(1,v/max);
  const drain=(cats&&cats['залипание'])||0, work=((cats&&cats['работа'])||0)+((cats&&cats['развитие'])||0);
  const col= drain>work? `rgba(197,106,99,${0.15+f*0.75})` : `rgba(203,176,124,${0.12+f*0.8})`;
  return `<i style="background:${col}" title="${fmtH(v)}${drain>work?' · больше залипания':''}"></i>`;
}

/* ---------- ПРАВДА: разрыв слов и дел ---------- */
/* Заявленные приоритеты против фактического распределения времени и XP. */
function priorities(){ V.priorities=V.priorities||[]; return V.priorities; }
function prioAdd(){
  openModal('Что для тебя важно',`
    <div class="mrow"><label>Сфера</label><input id="pr_n" placeholder="Тело / Деньги / Отношения / Проект"></div>
    <div class="mrow"><label>Насколько важно, 0–100</label><input id="pr_w" type="number" value="80" min="0" max="100"></div>
    <div class="mrow"><label>Чем это меряется</label>
      <select id="pr_src" style="width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--ivory);font-size:14px">
        <option value="cat:работа">время: работа</option>
        <option value="cat:развитие">время: развитие</option>
        <option value="cat:общение">время: общение</option>
        <option value="cat:отдых">время: отдых</option>
        <option value="skill">XP по навыку</option>
      </select></div>
    <div class="mrow"><label>Навык (если выбран XP)</label><input id="pr_sk" placeholder="Тело / Деньги / Ум…"></div>`,
  ()=>{ const n=$('#pr_n').value.trim(); if(!n)return;
    priorities().push({id:uid(),name:n,w:+($('#pr_w').value||50),
      src:$('#pr_src').value,skill:$('#pr_sk').value.trim(),born:now()});
    save();render();toast('записал',{type:'ok'}); });
}
function prioActual(p,days){
  days=days||30;
  if(p.src&&p.src.startsWith('cat:')){
    const c=p.src.slice(4), agg=timeRange(days), tot=timeTotal(agg)||1;
    return {pct:Math.round((timeByCat(agg)[c]||0)/tot*100), unit:'времени'};
  }
  const from=now()-days*864e5;
  const all=(V.xpLog||[]).filter(e=>e.ts>=from&&e.amount>0);
  const tot=all.reduce((a,e)=>a+e.amount,0)||1;
  const sk=V.skills.find(s=>s.name.toLowerCase()===String(p.skill||p.name).toLowerCase());
  const mine=sk?all.filter(e=>e.skillId===sk.id).reduce((a,e)=>a+e.amount,0):0;
  return {pct:Math.round(mine/tot*100), unit:'усилий'};
}
function prioGaps(days){
  const ps=priorities(); if(!ps.length)return [];
  const wsum=ps.reduce((a,p)=>a+(+p.w||0),0)||1;
  return ps.map(p=>{ const a=prioActual(p,days);
    const claim=Math.round((+p.w||0)/wsum*100);
    return {p,claim,actual:a.pct,unit:a.unit,gap:a.pct-claim};
  }).sort((a,b)=>a.gap-b.gap);
}

/* ---------- СВЯЗИ: корреляции на твоих числах ---------- */
function daySeries(days){
  days=days||45; const out=[];
  for(let i=days-1;i>=0;i--){
    const d=dshift(-i), a=new Date(d+'T00:00').getTime(), b=a+864e5;
    const rec=(V.time||{})[d]||{}, tot=Object.values(rec).reduce((x,y)=>x+y,0);
    const cat=c=>Object.entries(rec).filter(([k])=>tCat(k)===c).reduce((x,[,v])=>x+v,0);
    const xp=(V.xpLog||[]).filter(e=>e.ts>=a&&e.ts<b);
    const texts=(V.chat||[]).filter(c=>c.role==='me'&&c.ts>=a&&c.ts<b).map(c=>String(c.text||''));
    const idx=texts.length>=2?speechIndex(speechOf(texts)):null;
    const hrec=(V.hours||{})[d]||{};
    const night=Object.entries(hrec).filter(([k])=>{const h=+k.split('|')[0];return h<5||h>=23;})
      .reduce((x,[,v])=>x+v,0);
    out.push({d,
      screen:Math.round(tot/60), drain:Math.round(cat('залипание')/60),
      work:Math.round((cat('работа')+cat('развитие'))/60),
      night:Math.round(night/60),
      xp:xp.reduce((s,e)=>s+Math.max(0,+e.amount||0),0),
      neg:xp.filter(e=>e.amount<0).length,
      frag:fragDay(d),
      tone:idx?idx.tone:null, heat:idx?idx.heat:null, clarity:idx?idx.clarity:null,
      msgs:texts.length});
  }
  return out;
}
function pearson(a,b){
  const p=a.map((v,i)=>[v,b[i]]).filter(x=>x[0]!==null&&x[1]!==null&&!isNaN(x[0])&&!isNaN(x[1]));
  const n=p.length; if(n<8)return null;
  const mx=p.reduce((s,x)=>s+x[0],0)/n, my=p.reduce((s,x)=>s+x[1],0)/n;
  let num=0,dx=0,dy=0;
  p.forEach(([x,y])=>{num+=(x-mx)*(y-my);dx+=(x-mx)**2;dy+=(y-my)**2;});
  if(!dx||!dy)return null;
  return {r:+(num/Math.sqrt(dx*dy)).toFixed(2), n};
}
function shift1(arr){ return arr.slice(0,-1); }
function next1(arr){ return arr.slice(1); }

const LINKS=[
  ['drain','xp',   'залипание сегодня','темп завтра',true],
  ['night','clarity','ночные часы','ясность речи назавтра',true],
  ['frag','xp',    'дробление внимания','темп в тот же день',false],
  ['screen','tone','часы у экрана','тон в тот же день',false],
  ['heat','xp',    'накал речи','темп назавтра',true],
  ['work','tone',  'работа сегодня','тон назавтра',true],
  ['night','heat', 'ночные часы','накал речи назавтра',true],
  ['drain','tone', 'залипание','тон в тот же день',false],
  ['frag','clarity','дробление внимания','ясность мысли',false],
  ['screen','xp',  'часы у экрана','темп в тот же день',false]
];
function findLinks(days){
  const s=daySeries(days||45);
  const res=[];
  LINKS.forEach(([ka,kb,na,nb,lag])=>{
    const A=lag?shift1(s.map(x=>x[ka])):s.map(x=>x[ka]);
    const B=lag?next1(s.map(x=>x[kb])):s.map(x=>x[kb]);
    const c=pearson(A,B);
    if(c&&Math.abs(c.r)>=0.35)res.push({na,nb,r:c.r,n:c.n,lag});
  });
  return res.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
}
function rWord(r){
  const a=Math.abs(r);
  if(a>=0.7)return 'сильная';
  if(a>=0.5)return 'заметная';
  return 'слабая';
}

/* Brier: чем ниже — тем точнее прогнозы. 0 идеал, 0.25 — монетка */
function brier(list){
  const r=list.filter(d=>d.out!==null&&d.out!==undefined);
  if(!r.length)return null;
  const s=r.reduce((a,d)=>a+Math.pow(d.p/100-d.out,2),0)/r.length;
  return {score:+s.toFixed(3), n:r.length};
}
/* калибровка по корзинам уверенности */
function calibration(){
  const r=decisions().filter(d=>d.out!==null&&d.out!==undefined);
  const bins=[[0,40],[40,60],[60,75],[75,90],[90,100]];
  return bins.map(([a,b])=>{
    const g=r.filter(d=>d.p>=a&&d.p<(b===100?101:b));
    const hit=g.length?g.filter(d=>d.out===1).length/g.length*100:null;
    const said=g.length?g.reduce((s,d)=>s+d.p,0)/g.length:null;
    return {a,b,n:g.length,said:said!==null?Math.round(said):null,hit:hit!==null?Math.round(hit):null};
  });
}
function decBias(){
  const c=calibration().filter(x=>x.n>=2&&x.hit!==null);
  if(c.length<2)return null;
  const d=c.reduce((s,x)=>s+(x.said-x.hit),0)/c.length;
  return {d:Math.round(d), word: d>8?'переоцениваешь себя':(d<-8?'недооцениваешь себя':'калибровка ровная')};
}
function decDue(){ return decisions().filter(d=>(d.out===null||d.out===undefined)&&d.due&&new Date(d.due)<=new Date()); }

/* ---------- ДИСЦИПЛИНА: производная от регулярности ----------
   Не начисляется за отдельные действия. Считается раз в сутки по стабильности:
   активные дни, выполнение привычек, закрытие задач, длина серии. */
function discSkill(){ return V.skills.find(s=>s.name==='Дисциплина'); }

function regularity(days){
  days=days||7;
  const set=new Set((V.xpLog||[]).filter(e=>e.amount>0&&e.ts>=now()-days*864e5)
    .map(e=>new Date(e.ts).toISOString().slice(0,10)));
  const active=set.size;
  const habits=(V.items||[]).filter(i=>i.type==='привычка');
  let hDone=0,hPlan=0;
  habits.forEach(h=>{ for(let i=0;i<days;i++){ hPlan++;
    if((h.log||[]).some(t=>new Date(t).toISOString().slice(0,10)===dshift(-i)))hDone++; } });
  const hRate=hPlan?hDone/hPlan:null;
  const closed=(V.items||[]).filter(i=>i.type==='задача'&&i.done&&i.doneAt&&i.doneAt>=now()-days*864e5).length;
  const opened=(V.items||[]).filter(i=>i.type==='задача'&&!i.done).length;
  const checks=Object.entries(V.checkLog||{}).filter(([d])=>{
    const dt=(now()-new Date(d+'T12:00').getTime())/864e5; return dt<days; })
    .reduce((a,[,v])=>a+(v||[]).length,0);
  return {active,days,hRate,hDone,hPlan,closed,opened,checks,streak:streakDays()};
}
function discGain(){
  const r=regularity(7);
  let x=0;
  x+=(r.active/7)*3.2;                                  // сколько дней вообще двигался
  if(r.hRate!==null)x+=r.hRate*3.4;                     // держишь ли привычки
  x+=Math.min(r.closed,4)*0.45;                         // закрываешь ли задачи
  x+=Math.min(r.streak,21)/21*2.2;                      // длина серии
  x+=Math.min(r.checks,14)*0.12;                        // отметки чек-ина
  return {xp:Math.round(x), r};
}
function disciplineTick(){
  const s=discSkill(); if(!s)return;
  const last=V.discTick||0;
  if(new Date(last).toISOString().slice(0,10)===today())return;
  const g=discGain();
  V.discTick=now();
  if(g.xp>0){
    const parts=[];
    if(g.r.active)parts.push(g.r.active+'/7 дней');
    if(g.r.hRate!==null)parts.push('привычки '+Math.round(g.r.hRate*100)+'%');
    if(g.r.streak>2)parts.push('серия '+g.r.streak);
    awardXP(s.id,g.xp,'регулярность: '+parts.join(', '));
  }
  save();
}

function skillSources(){

/* нативная шторка: снизу на мобиле, окном по центру на десктопе */
function openSheet(title,html){
  const w=document.createElement('div'); w.className='swrap';
  w.innerHTML=`<div class="sbox"><div class="sbar"></div>
    <div class="shead"><span>${esc(title)}</span><span class="sx">✕</span></div>
    <div class="scont">${html}</div></div>`;
  document.body.appendChild(w);
  requestAnimationFrame(()=>w.classList.add('on'));
  const close=()=>{ w.classList.remove('on'); setTimeout(()=>w.remove(),260); };
  w.querySelector('.sx').onclick=close;
  w.onclick=e=>{ if(e.target===w)close(); };
  const esc2=e=>{ if(e.key==='Escape'){close();document.removeEventListener('keydown',esc2);} };
  document.addEventListener('keydown',esc2);
}

/* повторы */
function evOnDate(e,dstr){
  if(!e.date)return false;
  if(e.date===dstr)return true;
  if(!e.repeat||e.repeat==='none')return false;
  const a=new Date(e.date+'T12:00'), b=new Date(dstr+'T12:00');
  if(b<a)return false;
  if(e.until&&dstr>e.until)return false;
  const dd=Math.round((b-a)/864e5);
  if(e.repeat==='daily')return true;
  if(e.repeat==='weekdays')return b.getDay()>=1&&b.getDay()<=5;
  if(e.repeat==='weekly')return dd%7===0;
  if(e.repeat==='biweekly')return dd%14===0;
  if(e.repeat==='monthly')return a.getDate()===b.getDate();
  return false;
}
function evDone(e,dstr){ return ((e.log||[]).includes(dstr))||(!e.repeat&&e.done); }
function dayEvents(dstr){
  const out=[];
  events().forEach(e=>{ if(evOnDate(e,dstr))out.push({...e,_d:dstr,src:'event'}); });
  (V.items||[]).forEach(i=>{
    if(i.type==='задача'&&i.due===dstr)out.push({id:i.id,title:i.title||i.text,type:i.done?'дело':'дело',
      time:i.time||'',done:i.done,src:'task',skill:i.skillName});
    if(i.type==='цель'&&i.due===dstr)out.push({id:i.id,title:i.title,type:'дедлайн',done:i.done,src:'goal'});
    if(i.type==='привычка'){
      const c=i.cadence||'daily';
      const wd=new Date(dstr+'T12:00').getDay();
      const ok=c==='daily'||(c==='weekdays'&&wd>=1&&wd<=5)||(c==='weekly'&&wd===1);
      if(ok&&dstr<=today())out.push({id:i.id,title:i.title||i.text,type:'дело',
        done:(i.log||[]).some(t=>dkey(new Date(t))===dstr),src:'habit',skill:i.skillName});
    }
  });
  return out.sort((a,b)=>String(a.time||'99').localeCompare(String(b.time||'99')));
}
function dayLoad(dstr){
  const ev=dayEvents(dstr);
  return {n:ev.length,done:ev.filter(e=>e.done).length,ev};
}
function toggleEv(id,src,dstr){
  if(src==='event'){
    const e=events().find(x=>x.id===id); if(!e)return;
    if(e.repeat&&e.repeat!=='none'){ e.log=e.log||[];
      const i=e.log.indexOf(dstr); if(i>=0)e.log.splice(i,1); else{e.log.push(dstr); evReward(e);} }
    else { e.done=!e.done; if(e.done)evReward(e); }
    save(); render(); return;
  }
  const it=(V.items||[]).find(x=>x.id===id); if(!it)return;
  if(src==='habit')toggleHabit(id); else toggleDone(id);
}

/* уведомления */
function askNotify(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default')Notification.requestPermission();
}
function notifyTick(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const t=today(), nowM=new Date().getHours()*60+new Date().getMinutes();
  V.notified=V.notified||{};
  dayEvents(t).forEach(e=>{
    if(!e.remind||!e.time||e.done)return;
    const [h,m]=e.time.split(':').map(Number); const em=h*60+m;
    const k=t+'_'+e.id;
    if(V.notified[k])return;
    if(nowM>=em-5&&nowM<=em+2){
      try{ new Notification('Мидас · '+e.title,{body:e.time+(e.type?' · '+e.type:''),silent:false}); }catch(x){}
      V.notified[k]=1; save();
    }
  });
  const ks=Object.keys(V.notified); if(ks.length>200){ks.slice(0,100).forEach(k=>delete V.notified[k]);save();}
}
